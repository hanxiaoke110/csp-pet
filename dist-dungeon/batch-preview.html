<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const MODELS = '__MODELS__'.split(',');
const results = {};
const W = 200, H = 200;

const renderer = new THREE.WebGLRenderer({alpha: true, antialias: true});
renderer.setSize(W, H); renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight('#ffffff', 2.0));
const key = new THREE.DirectionalLight('#ffffff', 2.5); key.position.set(3,4,5); scene.add(key);
const fill = new THREE.DirectionalLight('#ccddff', 1.0); fill.position.set(-2,0,-2); scene.add(fill);
const rim = new THREE.DirectionalLight('#ffffff', 1.0); rim.position.set(0,-0.5,3); scene.add(rim);
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 20);
camera.position.set(0, 0.3, 7); camera.lookAt(0, -0.3, 0);

let currentModel = null;

async function renderOne(path) {
  if (currentModel) { scene.remove(currentModel); currentModel = null; }
  try {
    const gltf = await new GLTFLoader().loadAsync(path);
    const model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    const c = box.getCenter(new THREE.Vector3());
    const s = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(s.x, s.y, s.z);
    const sc = 2.5 / maxDim;
    model.position.set(-c.x * sc, -c.y * sc, 0);
    model.scale.setScalar(sc);
    model.traverse(child => { if (child.material) { child.material.roughness = 0.6; child.material.metalness = 0.05; } });
    scene.add(model);
    model.rotation.y = 0.4;
    currentModel = model;
    renderer.render(scene, camera);
    return renderer.domElement.toDataURL('image/png');
  } catch(e) {
    return 'ERROR:' + e.message;
  }
}

window.renderAll = async function(modelList) {
  for (const m of modelList) {
    results[m] = await renderOne(m);
  }
  return JSON.stringify(Object.keys(results));
};
</script></body></html>
