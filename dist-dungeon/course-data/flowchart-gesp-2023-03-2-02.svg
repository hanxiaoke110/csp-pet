<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>
  <ellipse cx="160" cy="22" rx="38" ry="17" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="160" y="27" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">开始</text>
  <line x1="160" y1="39" x2="160" y2="70" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="160,70 235,120 160,170 85,120" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="160" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#9d174d">条件成立？</text>
  <text x="160" y="132" text-anchor="middle" font-size="11" fill="#9d174d">（判断条件）</text>
  <line x1="235" y1="120" x2="285" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="113" font-size="11" fill="#16a34a" font-weight="bold">是</text>
  <rect x="210" y="145" width="100" height="50" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="260" y="168" text-anchor="middle" font-size="12" fill="#166534">语句块A</text>
  <text x="260" y="184" text-anchor="middle" font-size="12" fill="#166534">（成立分支）</text>
  <line x1="285" y1="195" x2="285" y2="280" stroke="#475569" stroke-width="2"/>
  <line x1="285" y1="280" x2="160" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="160" y1="170" x2="160" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="132" y="195" font-size="11" fill="#dc2626" font-weight="bold">否</text>
  <rect x="105" y="210" width="110" height="50" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="160" y="233" text-anchor="middle" font-size="12" fill="#991b1b">语句块B</text>
  <text x="160" y="249" text-anchor="middle" font-size="12" fill="#991b1b">（不成立分支）</text>
  <line x1="160" y1="260" x2="160" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <ellipse cx="160" cy="340" rx="38" ry="17" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="160" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">汇合</text>
  <line x1="160" y1="357" x2="160" y2="385" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <ellipse cx="160" cy="402" rx="38" ry="17" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="160" y="407" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">结束</text>
</svg>