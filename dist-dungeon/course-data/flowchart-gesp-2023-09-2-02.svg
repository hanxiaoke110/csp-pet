<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 460" width="300" height="460">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>
  <ellipse cx="150" cy="22" rx="38" ry="17" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="150" y="27" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">开始</text>
  <line x1="150" y1="39" x2="150" y2="65" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="65" width="140" height="36" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="150" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">x = 5, y = 12</text>
  <line x1="150" y1="101" x2="150" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="150,140 215,190 150,240 85,190" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="150" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#9d174d">x > y ?</text>
  <line x1="215" y1="190" x2="270" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="183" font-size="11" fill="#16a34a" font-weight="bold">是</text>
  <rect x="225" y="205" width="90" height="36" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="270" y="223" text-anchor="middle" font-size="11" fill="#166534">a = x</text>
  <text x="270" y="237" text-anchor="middle" font-size="11" fill="#166534">b = y</text>
  <line x1="270" y1="241" x2="270" y2="300" stroke="#475569" stroke-width="2"/>
  <line x1="270" y1="300" x2="150" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="240" x2="150" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="132" y="265" font-size="11" fill="#dc2626" font-weight="bold">否</text>
  <rect x="80" y="280" width="140" height="36" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="150" y="298" text-anchor="middle" font-size="11" fill="#991b1b">a = y</text>
  <text x="150" y="313" text-anchor="middle" font-size="11" fill="#991b1b">b = x</text>
  <line x1="150" y1="316" x2="150" y2="350" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="350" width="140" height="36" rx="5" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="150" y="373" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">输出 a, b</text>
  <line x1="150" y1="386" x2="150" y2="415" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <ellipse cx="150" cy="432" rx="38" ry="17" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="150" y="437" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">结束</text>
</svg>
