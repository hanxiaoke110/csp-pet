<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 460" width="280" height="460">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <!-- Start -->
  <ellipse cx="140" cy="25" rx="35" ry="18" fill="#4CAF50" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="30" text-anchor="middle" fill="white" font-size="13" font-weight="bold">开始</text>
  <line x1="140" y1="43" x2="140" y2="70" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- sum = 0 -->
  <rect x="80" y="70" width="120" height="32" rx="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="91" text-anchor="middle" fill="#333" font-size="13">sum = 0, i = 1</text>
  <line x1="140" y1="102" x2="140" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- i <= 5? -->
  <polygon points="140,130 195,160 140,190 85,160" fill="#FFF9C4" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="163" text-anchor="middle" fill="#333" font-size="12">i &lt;= 5?</text>
  
  <!-- Yes: sum += 2, i++ -->
  <line x1="195" y1="160" x2="230" y2="160" stroke="#333" stroke-width="1.5"/>
  <text x="215" y="153" text-anchor="middle" fill="#555" font-size="10">是</text>
  <rect x="230" y="143" width="50" height="34" rx="3" fill="#E8F5E9" stroke="#333" stroke-width="1"/>
  <text x="255" y="155" text-anchor="middle" fill="#333" font-size="10">sum+=2</text>
  <text x="255" y="170" text-anchor="middle" fill="#333" font-size="10">i++</text>
  <!-- Loop back -->
  <path d="M255,177 C255,240 140,240 140,190" fill="none" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  
  <!-- No: output sum -->
  <line x1="140" y1="190" x2="140" y2="230" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="120" y="212" text-anchor="middle" fill="#555" font-size="10">否</text>
  
  <!-- Output (parallelogram) -->
  <polygon points="105,230 175,230 190,260 90,260" fill="#E3F2FD" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="250" text-anchor="middle" fill="#333" font-size="13">输出 sum</text>
  <line x1="140" y1="260" x2="140" y2="295" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Result: 10 -->
  <rect x="90" y="295" width="100" height="30" rx="3" fill="#FFF3E0" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="315" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">结果: 10</text>
  <line x1="140" y1="325" x2="140" y2="355" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- End -->
  <ellipse cx="140" cy="375" rx="35" ry="18" fill="#f44336" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="380" text-anchor="middle" fill="white" font-size="13" font-weight="bold">结束</text>
</svg>