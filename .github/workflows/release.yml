name: Build & Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVKEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Run release gates
        run: |
          npm test
          npm run test:question-bank
          npm run validate:assets
          npm run build
      - name: Verify deployed dungeon season API
        run: |
          season=$(curl -fsSL --retry 3 --max-time 30 \
            'https://api.cspstudy.top/api/dungeon/leaderboard?scope=global&type=power&season_id=2026-season-2' \
            | jq -r '.season // empty')
          test "$season" = '2026-season-2' || {
            echo "::error::Dungeon Worker is not serving season 2026-season-2"
            exit 1
          }

  # ── macOS (Apple Silicon) ──
  macos-aarch64:
    needs: preflight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npx tauri build --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  # ── macOS (Intel) ──
  macos-x86_64:
    needs: preflight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: rustup target add x86_64-apple-darwin
      - run: npx tauri build --target x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

  # ── Windows ──
  windows-x86_64:
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npx tauri build --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  # ── Release to Gitee + update update.json ──
  release:
    needs: [macos-aarch64, macos-x86_64, windows-x86_64]
    # 只在打 v* tag 时执行发布；手动触发（workflow_dispatch）只出构建产物，
    # 避免没有 tag 时把 Gitee update.json 覆盖成 refs/heads/master 之类的垃圾值。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { name: macos-aarch64, path: dist/macos-aarch64 }
      - uses: actions/download-artifact@v4
        with: { name: macos-x86_64, path: dist/macos-x86_64 }
      - uses: actions/download-artifact@v4
        with: { name: windows-x86_64, path: dist/windows-x86_64 }

      - name: Sign packages & generate update.json
        id: gen
        env:
          PRIVKEY: ${{ secrets.TAURI_UPDATER_PRIVKEY }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION_NUM="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          pkg() { find "dist/$1" \( -name "*.dmg" -o -name "*.exe" \) -type f | head -1; }

          MAC_ARM=$(pkg macos-aarch64)
          MAC_INTEL=$(pkg macos-x86_64)
          WIN_MSI=$(pkg windows-x86_64)

          # Rename to English filenames (productName is Chinese for App display name)
          # Signature embeds the filename, so we must rename BEFORE signing
          rename_eng() {
            local f="$1"
            if [ -z "$f" ] || [ ! -f "$f" ]; then echo ""; return; fi
            local dir=$(dirname "$f")
            local newname=$(basename "$f" | sed 's/CSP 学习助手/CSP/g')
            if [ "$(basename "$f")" != "$newname" ]; then
              mv "$f" "$dir/$newname"
            fi
            echo "$dir/$newname"
          }
          MAC_ARM=$(rename_eng "$MAC_ARM")
          MAC_INTEL=$(rename_eng "$MAC_INTEL")
          WIN_MSI=$(rename_eng "$WIN_MSI")

          for package in "$MAC_ARM" "$MAC_INTEL" "$WIN_MSI"; do
            if [ -z "$package" ] || [ ! -f "$package" ]; then
              echo "::error::Missing release package: $package"
              exit 1
            fi
            size=$(stat -c%s "$package")
            if [ "$size" -ge 100000000 ]; then
              echo "::error::$(basename "$package") is $size bytes, exceeding Gitee's 100 MB limit"
              exit 1
            fi
          done

          echo "$PRIVKEY" > /tmp/privkey

          sign_file() {
            local f="$1"
            if [ -n "$f" ] && [ -f "$f" ]; then
              # 只提取纯 base64 签名行（以 dW50 开头），滤掉 "Your file was signed..." 等说明文字
              npx @tauri-apps/cli signer sign --private-key "$PRIVKEY" --password "" "$f" 2>/dev/null | grep '^dW50' | head -1 || true
            else
              echo ""
            fi
          }

          # GitHub Release 会把非 ASCII 字符替换成点，URL 中需要用 sanitize 后的文件名
          sanitize_name() {
            basename "$1" | sed 's/[^a-zA-Z0-9._-]/./g' | sed 's/\.\.*/./g'
          }

          SIG_MAC_ARM=$(sign_file "$MAC_ARM")
          SIG_MAC_INTEL=$(sign_file "$MAC_INTEL")
          SIG_WIN=$(sign_file "$WIN_MSI")

          for signature in "$SIG_MAC_ARM" "$SIG_MAC_INTEL" "$SIG_WIN"; do
            if ! printf '%s' "$signature" | grep -Eq '^dW50[A-Za-z0-9+/=]+$'; then
              echo "::error::Updater signature is missing or malformed"
              exit 1
            fi
          done

          GITEE_API="https://gitee.com/api/v5/repos/hanliuliu110/csp-pet"

          # Gitee free repositories have a 1 GB release-attachment quota. Keep the
          # two newest previous releases so all three platform packages can upload.
          OLD_RELEASE_IDS=$(curl -s "$GITEE_API/releases?per_page=20" \
            -H "Authorization: token $GITEE_TOKEN" \
            | jq -r 'sort_by(.created_at) | reverse | .[2:][]?.id' 2>/dev/null || true)
          for OLD_RELEASE_ID in $OLD_RELEASE_IDS; do
            echo "Deleting old Gitee release $OLD_RELEASE_ID"
            curl -s -X DELETE "$GITEE_API/releases/$OLD_RELEASE_ID" \
              -H "Authorization: token $GITEE_TOKEN" >/dev/null
          done

          # Create Gitee release
          RELEASE_ID=$(curl -s -X POST "$GITEE_API/releases" \
            -H "Content-Type: application/json" \
            -H "Authorization: token $GITEE_TOKEN" \
            -d "{\"tag_name\":\"$VERSION\",\"name\":\"$VERSION\",\"body\":\"Release $VERSION\",\"prerelease\":false,\"target_commitish\":\"master\"}" | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "::error::Failed to create Gitee release"
            exit 1
          fi

          upload_file() {
            local f="$1"
            if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then return; fi
            if [ -z "$f" ] || [ ! -f "$f" ]; then return; fi
            local attempt resp url
            # GitHub runner → Gitee 上传不稳定（v1.7.31/32 曾三次全失败静默回退
            # GitHub URL，国内学生无法下载）：失败打日志 + 最多重试 3 次
            for attempt in 1 2 3; do
              resp=$(curl -s --connect-timeout 30 --max-time 900 -X POST "$GITEE_API/releases/$RELEASE_ID/attach_files" \
                -H "Authorization: token $GITEE_TOKEN" \
                -F "file=@$f")
              url=$(echo "$resp" | jq -r '.browser_download_url // .download_url // empty' 2>/dev/null)
              if [ -n "$url" ]; then echo "$url"; return; fi
              echo "Gitee upload attempt $attempt failed for $(basename "$f"): $(echo "$resp" | head -c 200)" >&2
              sleep 5
            done
          }

          # 三个包并行上传（每个约 90MB，串行曾让发布步骤耗时 30 分钟）
          upload_to_file() { upload_file "$1" > "$2"; }
          upload_to_file "$MAC_ARM" /tmp/url_mac_arm &
          upload_to_file "$MAC_INTEL" /tmp/url_mac_intel &
          upload_to_file "$WIN_MSI" /tmp/url_win &
          wait
          URL_MAC_ARM=$(cat /tmp/url_mac_arm)
          URL_MAC_INTEL=$(cat /tmp/url_mac_intel)
          URL_WIN=$(cat /tmp/url_win)

          for url in "$URL_MAC_ARM" "$URL_MAC_INTEL" "$URL_WIN"; do
            if ! printf '%s' "$url" | grep -Eq '^https://gitee\.com/hanliuliu110/csp-pet/releases/download/'; then
              echo "::error::A required Gitee package upload failed: $url"
              exit 1
            fi
          done

          cat > dist/update.json << JSONEOF
          {
            "version": "$VERSION_NUM",
            "notes": "Release $VERSION - 详见 Gitee Releases",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64":  { "signature": "$SIG_MAC_ARM",   "url": "$URL_MAC_ARM"   },
              "darwin-x86_64":   { "signature": "$SIG_MAC_INTEL", "url": "$URL_MAC_INTEL" },
              "windows-x86_64":  { "signature": "$SIG_WIN",       "url": "$URL_WIN"       }
            }
          }
          JSONEOF

          echo "=== update.json ==="
          cat dist/update.json

      - name: Update update.json on Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"

          GITEE_API="https://gitee.com/api/v5/repos/hanliuliu110/csp-pet"

          FILE_INFO=$(curl -s "$GITEE_API/contents/update.json" \
            -H "Authorization: token $GITEE_TOKEN")
          SHA=$(echo "$FILE_INFO" | jq -r '.sha // empty')

          ENCODED=$(base64 -w0 dist/update.json)

          if [ -n "$SHA" ] && [ "$SHA" != "null" ]; then
            RESPONSE=$(curl -fsS -X PUT "$GITEE_API/contents/update.json" \
              -H "Content-Type: application/json" \
              -H "Authorization: token $GITEE_TOKEN" \
              -d "{\"content\":\"$ENCODED\",\"sha\":\"$SHA\",\"message\":\"release: $VERSION\"}")
          else
            RESPONSE=$(curl -fsS -X POST "$GITEE_API/contents/update.json" \
              -H "Content-Type: application/json" \
              -H "Authorization: token $GITEE_TOKEN" \
              -d "{\"content\":\"$ENCODED\",\"message\":\"release: $VERSION\"}")
          fi

          echo "$RESPONSE" | jq -e '.content.sha and .content.path == "update.json"' >/dev/null

          echo "Update endpoint: https://gitee.com/hanliuliu110/csp-pet/raw/master/update.json"

      - name: GitHub Release (backup)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/macos-aarch64/*
            dist/macos-x86_64/*
            dist/windows-x86_64/*
            dist/update.json
          generate_release_notes: true

  # ── 发版后自动更新飞书「智子客户端更新」文档 ──
  # 依赖 GitHub Secrets：LARK_APP_ID / LARK_APP_SECRET（飞书自建应用，需 docx 文档读写权限）。
  # 未配置 secrets 时该任务自动跳过，不影响发版。
  update-feishu-doc:
    needs: release
    # secrets 不能在 job 级 if 里引用（非法语法），只在这里限定 tag 触发；
    # 凭据是否配置放到步骤级判断，未配置时跳过文档更新。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
      LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install -g @larksuite/cli
      - name: 配置飞书 bot 身份
        if: env.LARK_APP_ID != '' && env.LARK_APP_SECRET != ''
        run: echo "$LARK_APP_SECRET" | lark-cli config init --app-id "$LARK_APP_ID" --app-secret-stdin --brand feishu
      - name: 更新飞书版本更新文档
        if: env.LARK_APP_ID != '' && env.LARK_APP_SECRET != ''
        run: node scripts/update-feishu-release-doc.mjs --as bot
