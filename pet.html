<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSP Pet</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root {
        width: 100%; height: 100%;
        background: transparent !important;
        overflow: hidden;
        -webkit-app-region: drag;
        user-select: none;
      }
      canvas { display: block; }
      .pet-interact {
        cursor: pointer;
      }
      @keyframes fanIn {
        from { opacity: 0; transform: scale(0.5) translateY(10px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes bubbleIn {
        from { opacity: 0; transform: translateX(-50%) translateY(8px) scale(0.9); }
        to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Block right-click context menu and DevTools shortcuts in production
      document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' ||
            (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.code === 'KeyI' || e.code === 'KeyJ' || e.code === 'KeyC')) ||
            (e.ctrlKey && (e.key === 'U' || e.code === 'KeyU'))) {
          e.preventDefault(); return false;
        }
      });
    </script>
    <script type="module" src="/src/pet.tsx"></script>
  </body>
</html>
