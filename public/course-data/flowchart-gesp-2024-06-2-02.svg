<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" width="360" height="500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>
  <ellipse cx="180" cy="22" rx="38" ry="17" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="180" y="27" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">开始</text>
  <line x1="180" y1="39" x2="180" y2="70" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="115" y="70" width="130" height="40" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="180" y="88" text-anchor="middle" font-size="12" fill="#92400e">输入年份 yr</text>
  <text x="180" y="103" text-anchor="middle" font-size="12" fill="#92400e">（如 2024）</text>
  <line x1="180" y1="110" x2="180" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="180,150 260,200 180,250 100,200" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="180" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#9d174d">yr 能被 4 整除</text>
  <text x="180" y="206" text-anchor="middle" font-size="11" fill="#9d174d">且（不能被100整除</text>
  <text x="180" y="220" text-anchor="middle" font-size="11" fill="#9d174d">或能被400整除）？</text>
  <line x1="260" y1="200" x2="310" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="193" font-size="11" fill="#16a34a" font-weight="bold">是</text>
  <rect x="235" y="235" width="110" height="45" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="290" y="256" text-anchor="middle" font-size="12" fill="#166534">输出</text>
  <text x="290" y="272" text-anchor="middle" font-size="12" fill="#166534">"闰年"</text>
  <line x1="310" y1="280" x2="310" y2="360" stroke="#475569" stroke-width="2"/>
  <line x1="310" y1="360" x2="222" y2="360" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180" y1="250" x2="180" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="150" y="275" font-size="11" fill="#dc2626" font-weight="bold">否</text>
  <rect x="120" y="300" width="120" height="45" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="180" y="321" text-anchor="middle" font-size="12" fill="#991b1b">输出</text>
  <text x="180" y="337" text-anchor="middle" font-size="12" fill="#991b1b">"平年"</text>
  <line x1="180" y1="345" x2="180" y2="380" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <ellipse cx="180" cy="402" rx="38" ry="17" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="180" y="407" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">汇合</text>
  <line x1="180" y1="419" x2="180" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <ellipse cx="180" cy="467" rx="38" ry="17" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="180" y="472" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">结束</text>
</svg>