<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" width="320" height="460">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>
  <ellipse cx="160" cy="22" rx="38" ry="17" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="160" y="27" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">开始</text>
  <line x1="160" y1="39" x2="160" y2="70" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="100" y="70" width="120" height="50" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="160" y="93" text-anchor="middle" font-size="12" fill="#92400e">执行语句块</text>
  <text x="160" y="109" text-anchor="middle" font-size="12" fill="#92400e">（循环体）</text>
  <line x1="160" y1="120" x2="160" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="160,155 235,205 160,255 85,205" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="160" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#9d174d">条件为"是"？</text>
  <text x="160" y="217" text-anchor="middle" font-size="11" fill="#9d174d">（判断循环条件）</text>
  <line x1="235" y1="205" x2="285" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="198" font-size="11" fill="#16a34a" font-weight="bold">是</text>
  <line x1="285" y1="205" x2="285" y2="380" stroke="#475569" stroke-width="2"/>
  <line x1="285" y1="380" x2="198" y2="380" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="160" y1="255" x2="160" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="132" y="280" font-size="11" fill="#dc2626" font-weight="bold">否</text>
  <text x="90" y="300" font-size="11" fill="#64748b">回到语句块</text>
  <text x="90" y="314" font-size="11" fill="#64748b">继续循环</text>
  <path d="M 160 320 Q 80 320 80 250 Q 80 180 100 120" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <ellipse cx="160" cy="402" rx="38" ry="17" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="160" y="407" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">结束</text>
</svg>