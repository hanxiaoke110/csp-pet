<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- 开始 -->
  <ellipse cx="150" cy="25" rx="40" ry="18" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="150" y="30" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#333">开始</text>
  <line x1="150" y1="43" x2="150" y2="65" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- x=5, y=12 -->
  <rect x="70" y="65" width="160" height="30" rx="4" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="150" y="85" text-anchor="middle" font-size="14" font-family="monospace" fill="#333">x = 5,  y = 12</text>
  <line x1="150" y1="95" x2="150" y2="120" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 判断 x>y -->
  <polygon points="150,120 230,170 150,220 70,170" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <text x="150" y="167" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#333">x &gt; y ?</text>
  <text x="150" y="183" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#666">(5 &gt; 12 ?)</text>

  <!-- 是 → a=x,b=y -->
  <line x1="230" y1="170" x2="290" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="163" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#4caf50">是</text>
  <rect x="290" y="155" width="130" height="30" rx="4" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="355" y="175" text-anchor="middle" font-size="13" font-family="monospace" fill="#333">a = x,  b = y</text>

  <!-- 否 → a=y,b=x -->
  <line x1="150" y1="220" x2="150" y2="255" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="160" y="240" text-anchor="start" font-size="11" font-family="sans-serif" fill="#f44336">否</text>
  <rect x="70" y="255" width="160" height="30" rx="4" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="150" y="275" text-anchor="middle" font-size="13" font-family="monospace" fill="#333">a = y,  b = x</text>

  <!-- 汇合线 -->
  <line x1="355" y1="185" x2="355" y2="320" stroke="#333" stroke-width="1.5"/>
  <line x1="355" y1="320" x2="150" y2="320" stroke="#333" stroke-width="1.5"/>
  <line x1="150" y1="285" x2="150" y2="320" stroke="#333" stroke-width="1.5"/>

  <!-- 输出 a, b -->
  <line x1="150" y1="320" x2="150" y2="340" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="70" y="340" width="160" height="30" rx="4" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="150" y="360" text-anchor="middle" font-size="14" font-family="monospace" fill="#333">输出 a, b</text>

  <!-- 结束 -->
  <line x1="150" y1="370" x2="150" y2="392" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <ellipse cx="150" cy="407" rx="40" ry="18" fill="#ffebee" stroke="#f44336" stroke-width="2"/>
  <text x="150" y="412" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#333">结束</text>
</svg>
