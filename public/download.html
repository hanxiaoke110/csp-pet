<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="./app-icon.png">
<title>CSP 学习助手 - 下载</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #eef3f8; color: #17223b; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: white; border: 1px solid #dce5ef; border-radius: 12px; padding: 40px; max-width: 480px; width: 90%; box-shadow: 0 16px 40px rgba(23,34,59,0.14); text-align: center; }
  .app-icon { width: 82px; height: 82px; object-fit: contain; margin-bottom: 10px; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  .version { color: #f96d00; font-weight: 700; margin-bottom: 24px; }
  .btn { display: block; width: 100%; padding: 14px; margin: 10px 0; border: 2px solid #e2e8f0; border-radius: 10px; background: white; font-size: 15px; cursor: pointer; text-decoration: none; color: #1e293b; transition: all 0.2s; }
  .btn:hover { border-color: #ff8c00; background: #fff7ed; }
  .btn .platform { font-weight: 600; display: block; }
  .btn .detail { font-size: 12px; color: #94a3b8; margin-top: 2px; }
  .note { margin-top: 20px; font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
<div class="card">
  <img class="app-icon" src="./app-icon.png" alt="CSP 学习助手">
  <h1>CSP 学习助手</h1>
  <p class="version" id="ver">最新版本</p>
  <a class="btn" id="btn-mac-arm" href="#">
    <span class="platform">macOS Apple Silicon</span>
    <span class="detail">M1/M2/M3 Mac</span>
  </a>
  <a class="btn" id="btn-mac-intel" href="#">
    <span class="platform">macOS Intel</span>
    <span class="detail">旧款 Intel Mac</span>
  </a>
  <a class="btn" id="btn-win" href="#">
    <span class="platform">Windows 64位</span>
    <span class="detail">Windows 10/11</span>
  </a>
  <p class="note">下载后打开安装包即可安装</p>
</div>
<script>
fetch('https://gitee.com/hanliuliu110/csp-pet/raw/master/update.json')
  .then(r => r.json())
  .then(data => {
    const v = data.version;
    document.getElementById('ver').textContent = 'v' + v;
    // 直接用 update.json 的 platforms URL（与 App 自动更新同源），避免硬编码文件名导致 404
    const p = data.platforms || {};
    const fallback = `https://gitee.com/hanliuliu110/csp-pet/releases/tag/v${v}`;
    const pick = (key) => (p[key] && p[key].url) ? p[key].url : fallback;
    document.getElementById('btn-mac-arm').href = pick('darwin-aarch64');
    document.getElementById('btn-mac-intel').href = pick('darwin-x86_64');
    document.getElementById('btn-win').href = pick('windows-x86_64');
  })
  .catch(() => {
    document.getElementById('ver').textContent = '请打开 Gitee Releases 查看';
  });
</script>
</body>
</html>
