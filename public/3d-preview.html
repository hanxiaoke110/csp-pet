<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:transparent;width:200px;height:200px;overflow:hidden}
</style></head><body>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.184.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.184.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const p = new URLSearchParams(location.search);
const modelPath = p.get('model') || '/pet-sprites/3d/animal-fox.glb';

const renderer = new THREE.WebGLRenderer({alpha: true, antialias: true, preserveDrawingBuffer: true});
renderer.setSize(200, 200); renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight('#ffffff', 2.0));
const k = new THREE.DirectionalLight('#ffffff', 2.5); k.position.set(3,4,5); scene.add(k);
const f = new THREE.DirectionalLight('#ccddff', 1.0); f.position.set(-2,0,-2); scene.add(f);
const r = new THREE.DirectionalLight('#ffffff', 1.0); r.position.set(0,-0.5,3); scene.add(r);
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 20);
camera.position.set(0, 0.3, 7); camera.lookAt(0, -0.3, 0);

new GLTFLoader().load(modelPath, (gltf) => {
  const m = gltf.scene;
  const box = new THREE.Box3().setFromObject(m);
  const c = box.getCenter(new THREE.Vector3());
  const s = box.getSize(new THREE.Vector3());
  const sc = 2.5 / Math.max(s.x, s.y, s.z);
  m.position.set(-c.x * sc, -c.y * sc, 0);
  m.scale.setScalar(sc);
  m.traverse(ch => { if (ch.material) { ch.material.roughness = 0.6; ch.material.metalness = 0.05; } });
  scene.add(m);
  m.rotation.y = 0.4;
  renderer.render(scene, camera);
  document.title = 'DONE';
  window.__ready__ = true;
}, undefined, (err) => {
  document.title = 'ERROR:' + (err?.message || 'unknown');
});
</script></body></html>
