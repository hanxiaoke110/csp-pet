"code":"\\n#include <iostream>\\n#include <vector>\\n#include <queue>\\n#include <cstring>\\nusing namespace std;\\nconst int N = 205, INF = 1e9;\\nstruct Edge { int to, cap, rev; };\\nvector<Edge> g[N];\\nint level[N], iter[N];\\n\\nvoid addEdge(int u, int v, int cap) {\\n    g[u].push_back({v, cap, (int)g[v].size()});\\n    g[v].push_back({u, 0, (int)g[u].size() - 1});\\n}\\n\\nbool bfs(int s, int t) {\\n    memset(level, -1, sizeof(level));\\n    queue<int> q;\\n    level[s] = 0;\\n    q.push(s);\\n    while (!q.empty()) {\\n        int u = q.front(); q.pop();\\n        for (auto &e : g[u]) {\\n            if (e.cap > 0 && level[e.to] == -1) {\\n                level[e.to] = level[u] + 1;\\n                q.push(e.to);\\n            }\\n        }\\n    }\\n    return level[t] != -1;\\n}\\n\\nint dfs(int u, int t, int f) {\\n    if (u == t) return f;\\n    for (int &i = iter[u]; i < (int)g[u].size(); i++) {\\n        Edge &e = g[u][i];\\n        if (e.cap > 0 && level[u] < level[e.to]) {\\n            int d = dfs(e.to, t, min(f, e.cap));\\n            if (d > 0) {\\n                e.cap -= d;\\n                g[e.to][e.rev].cap += d;\\n                return d;\\n            }\\n        }\\n    }\\n    return 0;\\n}\\n\\nint maxFlow(int s, int t) {\\n    int flow = 0;\\n    while (bfs(s, t)) {\\n        memset(iter, 0, sizeof(iter));\\n        int f;\\n        while ((f = dfs(s, t, INF)) > 0) flow += f;\\n    }\\n    return flow;\\n}\\n\\nint main() {\\n    int n, m, s, t;\\n    cin >> n >> m >> s >> t;\\n    for (int i = 0; i < m; i++) {\\n        int u, v, c;\\n        cin >> u >> v >> c;\\n        addEdge(u, v, c);\\n    }\\n    cout << maxFlow(s, t) << endl;\\n    return 0;\\n}","image":null,"subQuestions":[{"label":"level\u6570\u7EC4\u7684\u542B\u4E49\u662F\uFF08 \uFF09\u3002","options":["\u8282\u70B9\u7684\u5165\u5EA6","\u8282\u70B9\u5728\u5206\u5C42\u56FE\u4E2D\u5230\u6E90\u70B9\u7684\u6700\u77ED\u8DDD\u79BB\uFF08\u8FB9\u6570\uFF09","\u8282\u70B9\u7684\u
