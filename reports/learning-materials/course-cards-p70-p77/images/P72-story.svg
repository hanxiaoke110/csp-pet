<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1125" viewBox="0 0 900 1125"><rect width="900" height="1125" fill="#f5f4ed"/><circle cx="865" cy="50" r="185" fill="#e6efe9"/><circle cx="780" cy="82" r="52" fill="none" stroke="#785233" stroke-width="2" opacity=".18"/><g font-family="PingFang SC, sans-serif"><text x="48" y="62" font-size="22" fill="#785233" letter-spacing="3">CSP 学习助手 · 课堂资料</text><rect x="48" y="90" width="96" height="70" rx="18" fill="#785233"/><text x="96" y="138" font-size="34" text-anchor="middle" fill="white">P72</text><text x="166" y="133" font-size="38" fill="#203344" font-weight="600">综合练习（一）</text><text x="48" y="203" font-size="25" fill="#627887">课前故事卡 · C4 提高</text><text x="64" y="265" font-size="39" fill="#785233">假期里的旅行列车</text><text x="64" y="330" font-size="29" fill="#26394b">旅行列车沿着固定路线经过六个景点，分别要花 3、1、1</text><text x="64" y="376.4" font-size="29" fill="#26394b">、1、2、1 天。你只有五天假期。列车向右加入新景点，</text><text x="64" y="422.8" font-size="29" fill="#26394b">一旦超时，就从左边舍去景点；可不能跳过中间的一站。</text><rect x="48" y="630" width="804" height="225" rx="22" fill="white" stroke="#d4e3e8"/><text x="76" y="675" font-size="24" fill="#785233">把故事变成算法</text><text x="76" y="724" font-size="27" fill="#26394b">3  |  1  |  1  |  1  |  2  |  1</text><text x="76" y="769" font-size="27" fill="#26394b">去掉左侧 3 → [1,1,1,2]，和=5，长=4</text><text x="64" y="926" font-size="29" fill="#785233">连续区间 + 正数：用滑动窗口找最长合法段。</text><path d="M48 1080 H852" stroke="#cbd9dc"/><text x="48" y="1110" font-size="17" fill="#7b8f98">先建立直觉，再回到完整讲义与代码 · P72</text><text x="852" y="1110" text-anchor="end" font-size="17" fill="#7b8f98">1 / 3</text></g></svg>