<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1125" viewBox="0 0 900 1125"><rect width="900" height="1125" fill="#f5f4ed"/><circle cx="865" cy="50" r="185" fill="#e6efe9"/><circle cx="780" cy="82" r="52" fill="none" stroke="#785233" stroke-width="2" opacity=".18"/><g font-family="PingFang SC, sans-serif"><text x="48" y="62" font-size="22" fill="#785233" letter-spacing="3">CSP 学习助手 · 课堂资料</text><rect x="48" y="90" width="96" height="70" rx="18" fill="#785233"/><text x="96" y="138" font-size="34" text-anchor="middle" fill="white">P77</text><text x="166" y="133" font-size="38" fill="#203344" font-weight="600">特殊二叉树与优先队列</text><text x="48" y="203" font-size="25" fill="#627887">课前故事卡 · C4 提高</text><text x="64" y="265" font-size="39" fill="#785233">果园的合并挑战</text><text x="64" y="330" font-size="29" fill="#26394b">果园有三堆果子，重量为 1、2、9。每次合并都要付出两</text><text x="64" y="376.4" font-size="29" fill="#26394b">堆重量之和。小伙伴先合最轻的两堆：付 3；再把 3 和 9</text><text x="64" y="422.8" font-size="29" fill="#26394b"> 合并：付 12。一共 15，比先合 2 和 9 的 23 更省力</text><text x="64" y="469.20000000000005" font-size="29" fill="#26394b">。</text><rect x="48" y="630" width="804" height="225" rx="22" fill="white" stroke="#d4e3e8"/><text x="76" y="675" font-size="24" fill="#785233">把故事变成算法</text><text x="76" y="724" font-size="27" fill="#26394b">1 + 2 → 3（费用 3）</text><text x="76" y="769" font-size="27" fill="#26394b">3 + 9 → 12（费用 12）</text><text x="76" y="814" font-size="27" fill="#26394b">总费用 = 3 + 12 = 15</text><text x="64" y="926" font-size="29" fill="#785233">每次取最小两堆，放回新堆，继续合并。</text><path d="M48 1080 H852" stroke="#cbd9dc"/><text x="48" y="1110" font-size="17" fill="#7b8f98">先建立直觉，再回到完整讲义与代码 · P77</text><text x="852" y="1110" text-anchor="end" font-size="17" fill="#7b8f98">1 / 3</text></g></svg>