<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1125" viewBox="0 0 900 1125"><rect width="900" height="1125" fill="#f5f4ed"/><circle cx="865" cy="50" r="185" fill="#e6efe9"/><circle cx="780" cy="82" r="52" fill="none" stroke="#785233" stroke-width="2" opacity=".18"/><g font-family="PingFang SC, sans-serif"><text x="48" y="62" font-size="22" fill="#785233" letter-spacing="3">CSP 学习助手 · 课堂资料</text><rect x="48" y="90" width="96" height="70" rx="18" fill="#785233"/><text x="96" y="138" font-size="34" text-anchor="middle" fill="white">P77</text><text x="166" y="133" font-size="38" fill="#203344" font-weight="600">特殊二叉树与优先队列</text><text x="48" y="203" font-size="25" fill="#627887">知识总览卡 · C4 提高</text><rect x="48" y="232" width="804" height="158" rx="22" fill="white" stroke="#d4e3e8"/><text x="76" y="279" font-size="28" fill="#785233">01  完全二叉树</text><text x="76" y="328" font-size="28" fill="#26394b">前面各层填满，最后一层从左到右连续。</text><rect x="48" y="410" width="804" height="158" rx="22" fill="white" stroke="#d4e3e8"/><text x="76" y="457" font-size="28" fill="#785233">02  堆的关系</text><text x="76" y="506" font-size="28" fill="#26394b">大根：父≥子；小根：父≤子。</text><rect x="48" y="588" width="804" height="158" rx="22" fill="white" stroke="#d4e3e8"/><text x="76" y="635" font-size="28" fill="#785233">03  优先队列</text><text x="76" y="684" font-size="28" fill="#26394b">默认取最大；greater 取最小。</text><rect x="48" y="766" width="804" height="158" rx="22" fill="white" stroke="#d4e3e8"/><text x="76" y="813" font-size="28" fill="#785233">04  操作顺序</text><text x="76" y="862" font-size="28" fill="#26394b">先 top 再 pop，新堆必须 push 回去。</text><text x="64" y="1014" font-size="25" fill="#9b422e">堆顶是最值，不代表整个堆有序；累计费用用 long long。</text><path d="M48 1080 H852" stroke="#cbd9dc"/><text x="48" y="1110" font-size="17" fill="#7b8f98">先建立直觉，再回到完整讲义与代码 · P77</text><text x="852" y="1110" text-anchor="end" font-size="17" fill="#7b8f98">2 / 3</text></g></svg>