<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1125" viewBox="0 0 900 1125"><rect width="900" height="1125" fill="#f5f4ed"/><circle cx="865" cy="50" r="185" fill="#e6efe9"/><circle cx="780" cy="82" r="52" fill="none" stroke="#785233" stroke-width="2" opacity=".18"/><g font-family="PingFang SC, sans-serif"><text x="48" y="62" font-size="22" fill="#785233" letter-spacing="3">CSP 学习助手 · 课堂资料</text><rect x="48" y="90" width="96" height="70" rx="18" fill="#785233"/><text x="96" y="138" font-size="34" text-anchor="middle" fill="white">P72</text><text x="166" y="133" font-size="38" fill="#203344" font-weight="600">综合练习（一）</text><text x="48" y="203" font-size="25" fill="#627887">复习结合卡 · C4 提高</text><rect x="48" y="246" width="804" height="154" rx="22" fill="white" stroke="#d4e3e8"/><text x="76" y="286" font-size="23" fill="#785233">挑战 1</text><text x="76" y="331" font-size="29" fill="#26394b">天数全是 6，假期 5 天，答案？</text><rect x="48" y="423" width="804" height="154" rx="22" fill="white" stroke="#d4e3e8"/><text x="76" y="463" font-size="23" fill="#785233">挑战 2</text><text x="76" y="508" font-size="29" fill="#26394b">[2,2,3] 中落在 [2,2] 的元素个数？</text><rect x="48" y="600" width="804" height="154" rx="22" fill="white" stroke="#d4e3e8"/><text x="76" y="640" font-size="23" fill="#785233">挑战 3</text><text x="76" y="685" font-size="29" fill="#26394b">窗口超限，只删一个就够吗？</text><text x="64" y="830" font-size="29" fill="#785233">核对答案</text><text x="64" y="875" font-size="26" fill="#26394b">1. 0</text><text x="64" y="917" font-size="26" fill="#26394b">2. 2，重复值对应不同选择。</text><text x="64" y="959" font-size="26" fill="#26394b">3. 不一定，while 收缩到合法。</text><text x="64" y="1040" font-size="22" fill="#627887">18803 旅行团 · 18804 干饭人 · 18809 古老车站</text><path d="M48 1080 H852" stroke="#cbd9dc"/><text x="48" y="1110" font-size="17" fill="#7b8f98">先建立直觉，再回到完整讲义与代码 · P72</text><text x="852" y="1110" text-anchor="end" font-size="17" fill="#7b8f98">3 / 3</text></g></svg>