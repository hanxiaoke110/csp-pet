<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1125" viewBox="0 0 900 1125"><rect width="900" height="1125" fill="#f5f4ed"/><circle cx="865" cy="50" r="185" fill="#e6efe9"/><circle cx="780" cy="82" r="52" fill="none" stroke="#785233" stroke-width="2" opacity=".18"/><g font-family="PingFang SC, sans-serif"><text x="48" y="62" font-size="22" fill="#785233" letter-spacing="3">CSP 学习助手 · 课堂资料</text><rect x="48" y="90" width="96" height="70" rx="18" fill="#785233"/><text x="96" y="138" font-size="34" text-anchor="middle" fill="white">P74</text><text x="166" y="133" font-size="38" fill="#203344" font-weight="600">真题演练（一）</text><text x="48" y="203" font-size="25" fill="#627887">课前故事卡 · C4 提高</text><text x="64" y="265" font-size="39" fill="#785233">数字工坊的排队秘诀</text><text x="64" y="330" font-size="29" fill="#26394b">工坊捡到了混在字母里的数字：2、9、0、1、0。小伙伴想</text><text x="64" y="376.4" font-size="29" fill="#26394b">拼出最大的数，把大的数字安排在最前面：9、2、1、0、0</text><text x="64" y="422.8" font-size="29" fill="#26394b">。零虽然站在最后，也一个都不能丢。</text><rect x="48" y="630" width="804" height="225" rx="22" fill="white" stroke="#d4e3e8"/><text x="76" y="675" font-size="24" fill="#785233">把故事变成算法</text><text x="76" y="724" font-size="27" fill="#26394b">290es1q0 → 2,9,0,1,0 → 92100</text><text x="76" y="769" font-size="27" fill="#26394b">拦截高度 389,207,158,300,155,159 → 2 套</text><text x="64" y="926" font-size="29" fill="#785233">先看题意和数据范围，再说明贪心为何正确。</text><path d="M48 1080 H852" stroke="#cbd9dc"/><text x="48" y="1110" font-size="17" fill="#7b8f98">先建立直觉，再回到完整讲义与代码 · P74</text><text x="852" y="1110" text-anchor="end" font-size="17" fill="#7b8f98">1 / 3</text></g></svg>