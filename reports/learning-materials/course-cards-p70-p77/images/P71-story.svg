<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1125" viewBox="0 0 900 1125"><rect width="900" height="1125" fill="#f5f4ed"/><circle cx="865" cy="50" r="185" fill="#e6efe9"/><circle cx="780" cy="82" r="52" fill="none" stroke="#256a85" stroke-width="2" opacity=".18"/><g font-family="PingFang SC, sans-serif"><text x="48" y="62" font-size="22" fill="#256a85" letter-spacing="3">CSP 学习助手 · 课堂资料</text><rect x="48" y="90" width="96" height="70" rx="18" fill="#256a85"/><text x="96" y="138" font-size="34" text-anchor="middle" fill="white">P71</text><text x="166" y="133" font-size="38" fill="#203344" font-weight="600">递归算法（二）</text><text x="48" y="203" font-size="25" fill="#627887">课前故事卡 · C3 进阶</text><text x="64" y="265" font-size="39" fill="#256a85">楼梯口的答案本</text><text x="64" y="330" font-size="29" fill="#26394b">小伙伴要走到第五级台阶，每步能走一级或两级。它发现：</text><text x="64" y="376.4" font-size="29" fill="#26394b">最后一步只能从第四级或第三级来。两个助手不断问同样的</text><text x="64" y="422.8" font-size="29" fill="#26394b">问题，于是它拿出答案本：算过一次就记下，下次直接翻看</text><text x="64" y="469.20000000000005" font-size="29" fill="#26394b">。</text><rect x="48" y="630" width="804" height="225" rx="22" fill="white" stroke="#d4e3e8"/><text x="76" y="675" font-size="24" fill="#256a85">把故事变成算法</text><text x="76" y="724" font-size="27" fill="#26394b">最后一步走 1 级：从 n−1 来</text><text x="76" y="769" font-size="27" fill="#26394b">最后一步走 2 级：从 n−2 来</text><text x="76" y="814" font-size="27" fill="#26394b">f(n) = f(n−1) + f(n−2)</text><text x="64" y="926" font-size="29" fill="#256a85">重复的子问题，用记忆化保存答案。</text><path d="M48 1080 H852" stroke="#cbd9dc"/><text x="48" y="1110" font-size="17" fill="#7b8f98">先建立直觉，再回到完整讲义与代码 · P71</text><text x="852" y="1110" text-anchor="end" font-size="17" fill="#7b8f98">1 / 3</text></g></svg>