<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1125" viewBox="0 0 900 1125"><rect width="900" height="1125" fill="#f5f4ed"/><circle cx="865" cy="50" r="185" fill="#e6efe9"/><circle cx="780" cy="82" r="52" fill="none" stroke="#785233" stroke-width="2" opacity=".18"/><g font-family="PingFang SC, sans-serif"><text x="48" y="62" font-size="22" fill="#785233" letter-spacing="3">CSP 学习助手 · 课堂资料</text><rect x="48" y="90" width="96" height="70" rx="18" fill="#785233"/><text x="96" y="138" font-size="34" text-anchor="middle" fill="white">P75</text><text x="166" y="133" font-size="38" fill="#203344" font-weight="600">真题演练（二）</text><text x="48" y="203" font-size="25" fill="#627887">课前故事卡 · C4 提高</text><text x="64" y="265" font-size="39" fill="#785233">公交站的优惠票</text><text x="64" y="330" font-size="29" fill="#26394b">小伙伴坐地铁拿到一张优惠票，45 分钟内能用来坐公交。</text><text x="64" y="376.4" font-size="29" fill="#26394b">上车时，它要从最早的票开始找：没用过、没过期、面额还</text><text x="64" y="422.8" font-size="29" fill="#26394b">足够。票只能用一次；时间差恰好 45 分钟，仍然有效。</text><rect x="48" y="630" width="804" height="225" rx="22" fill="white" stroke="#d4e3e8"/><text x="76" y="675" font-size="24" fill="#785233">把故事变成算法</text><text x="76" y="724" font-size="27" fill="#26394b">一张票 = 面额 + 获得时间 + 是否使用</text><text x="76" y="769" font-size="27" fill="#26394b">未用过 AND 时间差≤45 AND 面额≥票价</text><text x="64" y="926" font-size="29" fill="#785233">把文字规则变成状态，并逐条检查边界。</text><path d="M48 1080 H852" stroke="#cbd9dc"/><text x="48" y="1110" font-size="17" fill="#7b8f98">先建立直觉，再回到完整讲义与代码 · P75</text><text x="852" y="1110" text-anchor="end" font-size="17" fill="#7b8f98">1 / 3</text></g></svg>