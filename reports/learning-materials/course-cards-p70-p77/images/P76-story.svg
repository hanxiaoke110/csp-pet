<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1125" viewBox="0 0 900 1125"><rect width="900" height="1125" fill="#f5f4ed"/><circle cx="865" cy="50" r="185" fill="#e6efe9"/><circle cx="780" cy="82" r="52" fill="none" stroke="#785233" stroke-width="2" opacity=".18"/><g font-family="PingFang SC, sans-serif"><text x="48" y="62" font-size="22" fill="#785233" letter-spacing="3">CSP 学习助手 · 课堂资料</text><rect x="48" y="90" width="96" height="70" rx="18" fill="#785233"/><text x="96" y="138" font-size="34" text-anchor="middle" fill="white">P76</text><text x="166" y="133" font-size="38" fill="#203344" font-weight="600">树（一）</text><text x="48" y="203" font-size="25" fill="#627887">课前故事卡 · C4 提高</text><text x="64" y="265" font-size="39" fill="#785233">星树家族的名册</text><text x="64" y="330" font-size="29" fill="#26394b">星树家族从一个根节点向下分出枝条。小伙伴沿着父亲、孩</text><text x="64" y="376.4" font-size="29" fill="#26394b">子的关系画家谱：没有孩子的是叶子，同一个父亲的孩子是</text><text x="64" y="422.8" font-size="29" fill="#26394b">兄弟。找根时，它不看谁先登记，只看谁没有父亲。</text><rect x="48" y="630" width="804" height="225" rx="22" fill="white" stroke="#d4e3e8"/><text x="76" y="675" font-size="24" fill="#785233">把故事变成算法</text><g stroke="#785233" stroke-width="3"><path d="M450 710 L280 760 M450 710 L620 760 M280 760 L200 815 M280 760 L360 815"/></g><circle cx="450" cy="710" r="21" fill="#f5f4ed" stroke="#785233"/><text x="450" y="719" font-size="25" text-anchor="middle" fill="#26394b">1</text><circle cx="280" cy="760" r="21" fill="#f5f4ed" stroke="#785233"/><text x="280" y="769" font-size="25" text-anchor="middle" fill="#26394b">2</text><circle cx="620" cy="760" r="21" fill="#f5f4ed" stroke="#785233"/><text x="620" y="769" font-size="25" text-anchor="middle" fill="#26394b">3</text><circle cx="200" cy="815" r="21" fill="#f5f4ed" stroke="#785233"/><text x="200" y="824" font-size="25" text-anchor="middle" fill="#26394b">4</text><circle cx="360" cy="815" r="21" fill="#f5f4ed" stroke="#785233"/><text x="360" y="824" font-size="25" text-anchor="middle" fill="#26394b">5</text><text x="64" y="926" font-size="29" fill="#785233">树的关系看结构；遍历顺序看根、左、右的位置。</text><path d="M48 1080 H852" stroke="#cbd9dc"/><text x="48" y="1110" font-size="17" fill="#7b8f98">先建立直觉，再回到完整讲义与代码 · P76</text><text x="852" y="1110" text-anchor="end" font-size="17" fill="#7b8f98">1 / 3</text></g></svg>