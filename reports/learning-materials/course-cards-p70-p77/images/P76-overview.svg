<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1125" viewBox="0 0 900 1125"><rect width="900" height="1125" fill="#f5f4ed"/><circle cx="865" cy="50" r="185" fill="#e6efe9"/><circle cx="780" cy="82" r="52" fill="none" stroke="#785233" stroke-width="2" opacity=".18"/><g font-family="PingFang SC, sans-serif"><text x="48" y="62" font-size="22" fill="#785233" letter-spacing="3">CSP 学习助手 · 课堂资料</text><rect x="48" y="90" width="96" height="70" rx="18" fill="#785233"/><text x="96" y="138" font-size="34" text-anchor="middle" fill="white">P76</text><text x="166" y="133" font-size="38" fill="#203344" font-weight="600">树（一）</text><text x="48" y="203" font-size="25" fill="#627887">知识总览卡 · C4 提高</text><rect x="48" y="232" width="804" height="158" rx="22" fill="white" stroke="#d4e3e8"/><text x="76" y="279" font-size="28" fill="#785233">01  找根</text><text x="76" y="328" font-size="28" fill="#26394b">没有父亲的节点就是根。</text><rect x="48" y="410" width="804" height="158" rx="22" fill="white" stroke="#d4e3e8"/><text x="76" y="457" font-size="28" fill="#785233">02  深度</text><text x="76" y="506" font-size="28" fill="#26394b">本课根深度为 1，示例树深度为 3。</text><rect x="48" y="588" width="804" height="158" rx="22" fill="white" stroke="#d4e3e8"/><text x="76" y="635" font-size="28" fill="#785233">03  前 / 中 / 后序</text><text x="76" y="684" font-size="28" fill="#26394b">根左右 / 左根右 / 左右根。</text><rect x="48" y="766" width="804" height="158" rx="22" fill="white" stroke="#d4e3e8"/><text x="76" y="813" font-size="28" fill="#785233">04  空孩子</text><text x="76" y="862" font-size="28" fill="#26394b">编号 0 表示空，递归先判断。</text><text x="64" y="1014" font-size="25" fill="#9b422e">普通二叉树的中序遍历不保证有序。</text><path d="M48 1080 H852" stroke="#cbd9dc"/><text x="48" y="1110" font-size="17" fill="#7b8f98">先建立直觉，再回到完整讲义与代码 · P76</text><text x="852" y="1110" text-anchor="end" font-size="17" fill="#7b8f98">2 / 3</text></g></svg>