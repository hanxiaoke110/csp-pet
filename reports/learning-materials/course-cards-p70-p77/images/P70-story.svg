<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1125" viewBox="0 0 900 1125"><rect width="900" height="1125" fill="#f5f4ed"/><circle cx="865" cy="50" r="185" fill="#e6efe9"/><circle cx="780" cy="82" r="52" fill="none" stroke="#256a85" stroke-width="2" opacity=".18"/><g font-family="PingFang SC, sans-serif"><text x="48" y="62" font-size="22" fill="#256a85" letter-spacing="3">CSP 学习助手 · 课堂资料</text><rect x="48" y="90" width="96" height="70" rx="18" fill="#256a85"/><text x="96" y="138" font-size="34" text-anchor="middle" fill="white">P70</text><text x="166" y="133" font-size="38" fill="#203344" font-weight="600">递归算法（一）</text><text x="48" y="203" font-size="25" fill="#627887">课前故事卡 · C3 进阶</text><text x="64" y="265" font-size="39" fill="#256a85">七层塔的传令铃</text><text x="64" y="330" font-size="29" fill="#26394b">塔顶的小信使要算出七层共有多少盏灯。它把下面六层交给</text><text x="64" y="376.4" font-size="29" fill="#26394b">下一位信使，自己只数这一层。每位信使都照做，直到第一</text><text x="64" y="422.8" font-size="29" fill="#26394b">层直接报出答案，再一层层把结果送回。</text><rect x="48" y="630" width="804" height="225" rx="22" fill="white" stroke="#d4e3e8"/><text x="76" y="675" font-size="24" fill="#256a85">把故事变成算法</text><text x="76" y="724" font-size="27" fill="#26394b">sum(4) → sum(3) → sum(2) → sum(1) → sum(0)</text><text x="76" y="769" font-size="27" fill="#26394b">10 ← 6 ← 3 ← 1 ← 0</text><text x="64" y="926" font-size="29" fill="#256a85">递归：先交出小问题，再接回答案。</text><path d="M48 1080 H852" stroke="#cbd9dc"/><text x="48" y="1110" font-size="17" fill="#7b8f98">先建立直觉，再回到完整讲义与代码 · P70</text><text x="852" y="1110" text-anchor="end" font-size="17" fill="#7b8f98">1 / 3</text></g></svg>