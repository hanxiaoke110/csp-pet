<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const API = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
  ? (new URLSearchParams(location.search).get('api') || 'https://api.cspstudy.top')
  : 'https://api.cspstudy.top';
let state = { page: 'login', token: '', teacher: null, _adminToken: '' };

function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; setTimeout(() => el.remove(), 300); }, 2500);
}

async function api(path, opts={}) {
  const isForm = opts.body instanceof FormData;
  const headers = { ...(isForm ? {} : { 'Content-Type': 'application/json' }), ...opts.headers };
  if (state._adminToken) headers['X-Admin-Token'] = state._adminToken;
  else if (state.token) headers['X-Teacher-Token'] = state.token;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), opts.timeout || 15000);
  let resp;
  try {
    resp = await fetch(`${API}${path}`, { ...opts, headers, signal: controller.signal });
  } catch (err) {
    const aborted = err && err.name === 'AbortError';
    return { error: aborted ? '请求超时，请检查网络后重试' : '网络连接失败，请检查 api.cspstudy.top 是否可访问' };
  } finally {
    clearTimeout(timer);
  }
  if (!resp.ok) {
    try { const err = await resp.json(); return { error: err.error || `请求失败 (${resp.status})` }; }
    catch { return { error: `请求失败 (${resp.status})` }; }
  }
  try { return await resp.json(); }
  catch { return { error: '响应格式错误' }; }
}

// Workshop constants
const ELEMENTS = ['earth','fire','wind','water','light'];
const ELEM_LABEL = { earth:'🟫 地', fire:'🔴 火', wind:'🟢 风', water:'🔵 水', light:'🌟 光' };
const TIER_LABEL = { common:'⭐ 普通', rare:'✨ 稀有', legendary:'👑 传说' };
const TIERS = [{ key:'common', label:'⭐ 普通', price:150 },{ key:'rare', label:'✨ 稀有', price:260 },{ key:'legendary', label:'👑 传说', price:500 }];

// Permission definitions — add new features here, Admin + Teacher UI auto-pickup
const PERM_DEFS = [
  { key:'question_bank_review', tab:'question-bank', icon:'✓', label:'题库质检' },
  // { key:'summer2026', icon:'☀️', label:'暑期集训' },  ← 未来功能示例
];

function safeParsePerms(raw) { if (!raw) return []; try { return JSON.parse(raw); } catch { return []; } }

// ═══ Login ═══
function LoginPage() {
  const [mode, setMode] = React.useState('login');
  const [phone, setPhone] = React.useState('');
  const [password, setPassword] = React.useState('');
  const [name, setName] = React.useState('');
  const [adminToken, setAdminToken] = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const isAdmin = mode === 'admin';

  const submit = async () => {
    setLoading(true);
    if (isAdmin) {
      if (!adminToken) { toast('请输入管理密码','error'); setLoading(false); return; }
      let resp;
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 15000);
        try {
          resp = await fetch(`${API}/api/admin/settings`, { headers: { 'X-Admin-Token': adminToken }, signal: controller.signal });
        } finally {
          clearTimeout(timer);
        }
      } catch (err) {
        toast(err && err.name === 'AbortError' ? '请求超时，请检查网络后重试' : '网络连接失败，请检查 api.cspstudy.top 是否可访问','error');
        setLoading(false);
        return;
      }
      if (!resp.ok) { toast(resp.status===401?'管理密码错误':'网络错误','error'); setLoading(false); return; }
      state._adminToken = adminToken; state.token = '';
      state.teacher = { teacher_id: 'admin', name: '管理员' };
      localStorage.setItem('csp_admin_token', adminToken);
      state.page = 'dashboard'; render(); return;
    }
    if (!phone) { toast('请输入手机号','error'); setLoading(false); return; }
    if (!/^1[3-9]\d{9}$/.test(phone)) { toast('手机号格式不正确','error'); setLoading(false); return; }
    if (!password || password.length < 6) { toast('密码至少6位','error'); setLoading(false); return; }
    if (mode === 'register' && !name.trim()) { toast('请填写花名','error'); setLoading(false); return; }
    if (mode === 'register' && !/^[一-龥]{2,10}$/.test(name.trim())) { toast('花名需2-10个汉字','error'); setLoading(false); return; }
    const ep = mode === 'register' ? '/api/teacher/register' : '/api/teacher/login';
    const data = await api(ep, { method: 'POST', body: JSON.stringify(mode === 'register' ? { phone, password, name: name.trim() } : { phone, password }) });
    if (data.error) { toast(data.error, 'error'); setLoading(false); return; }
    state.token = data.token; state._adminToken = '';
    state.teacher = { teacher_id: data.teacher_id, name: data.name, permissions: data.permissions || [] };
    localStorage.setItem('csp_teacher_token', data.token);
    localStorage.setItem('csp_teacher_info', JSON.stringify(state.teacher));
    localStorage.removeItem('csp_admin_token');
    state.page = 'dashboard'; render();
  };

  return React.createElement('div', { className: 'login-box card' },
    React.createElement('div', { className:'login-brand' },
      React.createElement('img', { className:'brand-icon', src:'./app-icon.png', alt:'' }),
      React.createElement('h2', null, 'CSP 教师管理'),
    ),
    React.createElement('div', { className:'tabs', style:{ justifyContent:'center' } },
      React.createElement('button', { className:`tab ${mode==='login'?'active':''}`, onClick:()=>setMode('login') }, '教师登录'),
      React.createElement('button', { className:`tab ${mode==='register'?'active':''}`, onClick:()=>setMode('register') }, '注册'),
      React.createElement('button', { className:`tab ${mode==='admin'?'active':''}`, onClick:()=>setMode('admin') }, '🔑 管理员'),
    ),
    isAdmin ? React.createElement('div', null,
      React.createElement('div', { className:'form-group' },
        React.createElement('label', null, '管理密码'),
        React.createElement('input', { className:'input', type:'password', value:adminToken, onChange:e=>setAdminToken(e.target.value), placeholder:'输入管理密码', onKeyDown:e=>e.key==='Enter'&&submit() }),
      ),
      React.createElement('button', { className:'btn btn-primary', style:{ width:'100%', padding:12 }, onClick:submit, disabled:loading }, loading ? '验证中...' : '登录'),
    ) : React.createElement('div', null,
      React.createElement('div', { className:'form-group' },
        React.createElement('label', null, '手机号'),
        React.createElement('input', { className:'input', value:phone, onChange:e=>setPhone(e.target.value.slice(0,11)), placeholder:'请输入11位手机号', autoFocus:true }),
      ),
      mode==='register' && React.createElement('div', { className:'form-group' },
        React.createElement('label', null, '花名'),
        React.createElement('input', { className:'input', value:name, onChange:e=>setName(e.target.value), placeholder:'花名 2-10个汉字（如：李老师）' }),
      ),
      React.createElement('div', { className:'form-group' },
        React.createElement('label', null, '密码'),
        React.createElement('input', { className:'input', type:'password', value:password, onChange:e=>setPassword(e.target.value), placeholder:'至少6位', onKeyDown:e=>e.key==='Enter'&&submit() }),
      ),
      React.createElement('button', { className:'btn btn-primary', style:{ width:'100%', padding:12 }, onClick:submit, disabled:loading },
        loading ? '处理中...' : (mode==='login'?'登录':'注册')),
      React.createElement('div', { style:{ fontSize:11, color:'#94a3b8', textAlign:'center', marginTop:10 } },
        mode==='register' ? '注册后自动登录 · 手机号重复会提示' : '没有账号？点上方"注册"创建'),
    ),
  );
}

// ═══ Dashboard ═══
function Dashboard() {
  const [tab, setTab] = React.useState(new URLSearchParams(location.search).get('tab') || 'teachers');
  const [loading, setLoading] = React.useState(false);
  const [data, setData] = React.useState([]);
  const [selected, setSelected] = React.useState(null);
  const [subData, setSubData] = React.useState([]);
  const [subSelected, setSubSelected] = React.useState(null);
  const [wishes, setWishes] = React.useState([]);
  const [workshopPets, setWorkshopPets] = React.useState([]);
  const [petLimitDefault, setPetLimitDefault] = React.useState(20);
  const [petLimitInput, setPetLimitInput] = React.useState('');

  const isAdmin = !!state._adminToken;

  React.useEffect(() => {
    if (tab === 'teachers') { isAdmin ? loadAdminTeachers() : loadClasses(); if (isAdmin) loadPetLimit(); }
    if (tab === 'wishes') loadWishes();
    if (tab === 'workshop-my') loadWorkshopPets();
    setSelected(null); setSubData([]); setSubSelected(null);
  }, [tab]);

  // ── Data loaders ──
  async function loadAdminTeachers() {
    setLoading(true); const d = await api('/api/admin/teachers');
    if (Array.isArray(d)) setData(d); setLoading(false); render();
  }
  async function loadPetLimit() {
    const d = await api('/api/admin/settings');
    if (d && !d.error && Number.isInteger(d.pet_limit_default)) { setPetLimitDefault(d.pet_limit_default); setPetLimitInput(String(d.pet_limit_default)); }
    render();
  }
  async function savePetLimit() {
    const n = parseInt(petLimitInput, 10);
    if (!Number.isInteger(n) || n < 1) { toast('上限必须为 ≥1 的整数','error'); return; }
    const d = await api('/api/admin/settings', { method:'POST', body:JSON.stringify({ pet_limit_default:n }) });
    if (d.error) toast(d.error,'error'); else { setPetLimitDefault(n); setPetLimitInput(String(n)); toast('✅ 全局默认上限已更新为 '+n); }
  }
  async function editMaxPets(t) {
    const cur = t.max_pets != null ? String(t.max_pets) : '全局默认('+petLimitDefault+')';
    const input = prompt(`为 ${t.name} 设置精灵上限（当前：${cur}）\n输入 ≥1 的整数；留空恢复全局默认：`, t.max_pets != null ? String(t.max_pets) : '');
    if (input === null) return; // 取消
    const trimmed = input.trim();
    let body;
    if (trimmed === '') {
      if (!confirm(`确认让 ${t.name} 恢复使用全局默认（${petLimitDefault}）？`)) return;
      body = { max_pets: null };
    } else {
      const n = parseInt(trimmed, 10);
      if (!Number.isInteger(n) || n < 1) { toast('上限必须为 ≥1 的整数','error'); return; }
      body = { max_pets: n };
    }
    const d = await api('/api/admin/teachers/'+t.teacher_id+'/max-pets', { method:'POST', body:JSON.stringify(body) });
    if (d.error) toast(d.error,'error'); else { toast('✅ '+t.name+' 上限已更新'); loadAdminTeachers(); }
  }
  async function loadClasses() {
    setLoading(true); const d = await api('/api/classes');
    if (Array.isArray(d)) setData(d); setLoading(false); render();
  }
  async function loadStudents(classCode) {
    setLoading(true); setSelected(classCode);
    if (isAdmin) { const d = await api(`/api/teacher/students?class_code=${classCode}`); setSubData(Array.isArray(d)?d:[]); }
    else { const d = await api(`/api/teacher/students?class_code=${classCode}`); setSubData(Array.isArray(d)?d:[]); }
    setLoading(false); render();
  }
  async function loadAdminClasses(teacherId) {
    setLoading(true); setSelected(teacherId);
    const d = await api(`/api/admin/classes?teacher_id=${teacherId}`);
    if (Array.isArray(d)) setSubData(d); setLoading(false); render();
  }
  async function loadWishes() {
    setLoading(true);
    if (isAdmin) { const d = await api('/api/admin/teachers'); if (Array.isArray(d)) setData(d); }
    else { const d = await api('/api/admin/wishes'); if (Array.isArray(d)) setWishes(d); }
    setLoading(false); render();
  }
  async function loadTeacherWishes(teacherId) {
    setLoading(true); setSelected(teacherId);
    const d = await api(`/api/admin/wishes/by-teacher?teacher_id=${teacherId}`);
    if (Array.isArray(d)) setWishes(d); setLoading(false); render();
  }
  async function loadWorkshopPets() {
    const d = await api('/api/workshop/pets');
    if (Array.isArray(d)) { setWorkshopPets(d); }
  }

  // ── Actions ──
  async function addTeacher() {
    const phone = prompt('手机号：'); if (!phone) return;
    const password = prompt('密码（至少6位）：'); if (!password||password.length<6) return toast('密码至少6位','error');

function AnnouncementPanel({ isAdmin }) {
  const [items, setItems] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [saving, setSaving] = React.useState(false);
  const [editingId, setEditingId] = React.useState(null);
  const [title, setTitle] = React.useState('');
  const [content, setContent] = React.useState('');
  const [pinned, setPinned] = React.useState(false);
  const base = isAdmin ? '/api/admin/announcements' : '/api/teacher/announcements';

  async function load() {
    setLoading(true);
    const data = await api(base);
    if (data.error) toast(data.error, 'error');
    else setItems(Array.isArray(data.items) ? data.items : []);
    setLoading(false);
  }

  React.useEffect(() => { load(); }, [isAdmin]);

  function resetForm() {
    setEditingId(null);
    setTitle('');
    setContent('');
    setPinned(false);
  }

  function edit(item) {
    setEditingId(item.id);
    setTitle(item.title || '');
    setContent(item.content || '');
    setPinned(!!item.pinned);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function save() {
    const cleanTitle = title.trim();
    const cleanContent = content.trim();
    if (!cleanTitle || !cleanContent) return toast('标题和内容不能为空', 'error');
    setSaving(true);
    const data = await api(editingId ? `${base}/${editingId}` : base, {
      method: editingId ? 'PUT' : 'POST',
      body: JSON.stringify({ title: cleanTitle, content: cleanContent, pinned }),
    });
    setSaving(false);
    if (data.error) return toast(data.error, 'error');
    toast(editingId ? '公告已更新' : '公告已发布');
    resetForm();
    load();
  }

  async function remove(item) {
    if (!confirm(`确认删除公告“${item.title}”？`)) return;
    const data = await api(`${base}/${item.id}`, { method:'DELETE' });
    if (data.error) return toast(data.error, 'error');

    if (editingId === item.id) resetForm();
    load();

const QB_ISSUE_LABELS = {
  'missing-options':'选项缺失', 'placeholder-options':'占位选项', 'duplicate-options':'选项重复',
  'invalid-answer':'答案无效', 'missing-explanation':'缺少解析', 'weak-explanation':'解析过短',
  'answer-conflict':'解析答案冲突', 'broken-option-text':'题干含空选项', 'suspicious-code':'代码疑似乱码'
};
const QB_CRITICAL_ISSUES = new Set(['missing-options','placeholder-options','invalid-answer','broken-option-text','suspicious-code']);

function inspectQuestion(q) {
  const issues = [];
  const options = Array.isArray(q.options) ? q.options : null;
  if (options) {
    if (options.length < 2 || options.some(v => !String(v || '').trim())) issues.push('missing-options');
    const placeholderCount = options.filter((v,index) => String(v || '').trim() === `${String.fromCharCode(65 + index)}. ${String.fromCharCode(65 + index)}`).length;
    const selfLabelOptionsArePlausible = /字母|字符|谁(?:是|为)|哪[个位]人|小偷/.test(String(q.question || ''));
    if (placeholderCount >= Math.min(3, options.length) && !selfLabelOptionsArePlausible) issues.push('placeholder-options');
    const normalized = options.map(v => String(v || '').replace(/^\s*[A-H][.、:]\s*/,'').trim()).filter(Boolean);
    if (new Set(normalized).size !== normalized.length) issues.push('duplicate-options');
    if (!Number.isInteger(q.correctIndex) || q.correctIndex < 0 || q.correctIndex >= options.length) issues.push('invalid-answer');
  }
  const exp = String(q.explanation || '').trim();
  if (!exp) issues.push('missing-explanation');
  else if (exp.length < 16 || /^官方答案[：:]?\s*[A-H]?[。.]?$/.test(exp)) issues.push('weak-explanation');
  if (options && Number.isInteger(q.correctIndex)) {
    const matches = [...exp.matchAll(/(?<!原)答案\s*(?:是|为|选)?\s*[：:]?\s*([A-H])/g)];
    if (matches.length && matches[matches.length - 1][1].toUpperCase().charCodeAt(0) - 65 !== q.correctIndex) issues.push('answer-conflict');
  }
  if (/\n\s*A\.\s*\n\s*\n?B\.\s*\n/i.test(String(q.question || ''))) issues.push('broken-option-text');
  if (/\bVv\b|^v\s{2,}|�|锟斤拷/m.test(String(q.code || ''))) issues.push('suspicious-code');
  return [...new Set(issues)];
}

function questionSourceLabel(q) {
  if (q.source === 'gesp') return `GESP ${q.level || '?'}级`;
  if (q.source === 'csp_exam') return q.examGroup || 'CSP-J';
  if (q.source === 'noip') return 'NOIP';
  if (q.source === 'super_challenge') return '专项挑战';
  return q.source || '未分类';
}

function questionImageUrl(path) {
  if (!path) return '';
  if (/^https?:\/\//.test(path)) return path;
  return 'https://gitee.com/hanliuliu110/csp-pet/raw/master/public' + (path.startsWith('/') ? path : '/' + path);
}

  const [exp, setExp] = React.useState(1000);
  const [count, setCount] = React.useState(3);
  const [result, setResult] = React.useState(null);
  const [genLoading, setGenLoading] = React.useState(false);

  const generate = async () => {
    const c = parseInt(coins, 10);
    const e = parseInt(exp, 10);
    const n = parseInt(count, 10) || 1;
    if (!(c >= 1 && c <= 10000) || !(e >= 1 && e <= 100000)) { toast('金币范围 1-10000，经验范围 1-100000', 'error'); return; }
    setGenLoading(true);
    const d = await api('/api/codes/comp', { method:'POST', body:JSON.stringify({ coins:c, exp:e, count:Math.min(n,20) }) });
    if (d.error) { toast(d.error, 'error'); setGenLoading(false); return; }
    setResult(d);
    setGenLoading(false);
    navigator.clipboard.writeText(d.codes.join('\n')).catch(()=>{});
  };

  return React.createElement('div', { className:'card' },
    React.createElement('h3', null, '🎁 Bug 补偿码'),
    React.createElement('div', { style:{ fontSize:12, color:'#94a3b8', marginBottom:14 } }, '金额由老师自定，每个码全局只能兑换一次（拿到码即可兑换）。经验到账后存入学生经验池。'),
    React.createElement('div', { style:{ display:'flex', gap:10, alignItems:'end', marginBottom:12, flexWrap:'wrap' } },
      React.createElement('div', { style:{ flex:1, minWidth:100 } },
        React.createElement('label', { style:{ fontSize:11, fontWeight:600, color:'#64748b', display:'block', marginBottom:4 } }, '金币 (1-10000)'),
        React.createElement('input', { className:'input', type:'number', value:coins, onChange:e=>setCoins(e.target.value), min:1, max:10000 }),
      ),
      React.createElement('div', { style:{ flex:1, minWidth:100 } },
        React.createElement('label', { style:{ fontSize:11, fontWeight:600, color:'#64748b', display:'block', marginBottom:4 } }, '经验 (1-100000)'),
        React.createElement('input', { className:'input', type:'number', value:exp, onChange:e=>setExp(e.target.value), min:1, max:100000 }),
      ),
      React.createElement('div', { style:{ width:80 } },
        React.createElement('label', { style:{ fontSize:11, fontWeight:600, color:'#64748b', display:'block', marginBottom:4 } }, '数量'),
        React.createElement('input', { className:'input', type:'number', value:count, onChange:e=>setCount(parseInt(e.target.value)||1), min:1, max:20 }),
      ),
      React.createElement('button', { className:'btn btn-primary', onClick:generate, disabled:genLoading, style:{ whiteSpace:'nowrap' } },
        genLoading ? '生成中...' : '🎲 生成'),
    ),
    result && React.createElement('div', { style:{ background:'#f8fafc', borderRadius:8, padding:12 } },
      React.createElement('div', { style:{ fontSize:12, fontWeight:600, marginBottom:8, display:'flex', justifyContent:'space-between' } },
        React.createElement('span', null, `已生成 ${result.codes.length} 个补偿码（+${result.coins}金币 +${result.exp}经验，已自动复制）`),
        React.createElement('button', { className:'btn btn-outline btn-sm', onClick:()=>{ navigator.clipboard.writeText(result.codes.join('\n')); toast('已复制'); } }, '📋 复制'),
      ),

// ═══ Workshop: Import Panel ═══
function ImportPanel({ onCreated }) {
  const [name, setName] = React.useState("");
  const [element, setElement] = React.useState("fire");
  const [style, setStyle] = React.useState("pixel");
  const [tier, setTier] = React.useState("rare");
  const [desc, setDesc] = React.useState("");
  const [resultUrl, setResultUrl] = React.useState(null);
  const [thumbUrl, setThumbUrl] = React.useState(null);
  const [petJsonData, setPetJsonData] = React.useState(null);
  const [submitting, setSubmitting] = React.useState(false);
  const [imported, setImported] = React.useState(false);
  const [creatorName, setCreatorName] = React.useState(state.teacher?.name || '');

  async function handleZipImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const zip = await JSZip.loadAsync(file);
      // 支持 pet.json 在根目录或子目录（Petdex 包常嵌套在 <name>/ 下）
      const jsonFile = zip.file("pet.json") || (zip.file(/(?:^|\/)pet\.json$/i) || [])[0];
      if (!jsonFile) { toast("压缩包缺少 pet.json","error"); return; }
      const petMeta = JSON.parse(await jsonFile.async("text"));
      let ssFile = null;
      zip.forEach(function(relativePath, file) {
        if (!ssFile && /spritesheet\.(webp|png)$/i.test(relativePath)) ssFile = file;
      });
      if (!ssFile) { toast("压缩包缺少 spritesheet","error"); return; }
      const ssBlob = await ssFile.async("blob");
      // 读 validation.json 提取真实动画元数据（Petdex 包有 cells: state/row/column/used）
      let valAnims = null, valAnimOrder = null;
      const valFile = zip.file("validation.json") || (zip.file(/(?:^|\/)validation\.json$/i) || [])[0];
      if (valFile) {
        try {
          const val = JSON.parse(await valFile.async("text"));
          if (Array.isArray(val.cells)) {
            const rows = {};
            for (const c of val.cells) {
              if (c.row == null || !c.state) continue;
              if (!rows[c.row]) rows[c.row] = { state: c.state, used: 0 };
              if (c.used) rows[c.row].used++;
            }
            const sortedRows = Object.keys(rows).sort(function(a,b){ return (+a)-(+b); });
            valAnimOrder = sortedRows.map(function(r){ return rows[r].state; });
            valAnims = {};
            sortedRows.forEach(function(r){ valAnims[rows[r].state] = rows[r].used || 6; });
          }
        } catch {}
      }
      if (petMeta.displayName) setName(petMeta.displayName);
      if (petMeta.description) setDesc(petMeta.description);
      const elemHints = { "火":"fire","焰":"fire", "水":"water","冰":"water","海":"water", "风":"wind","气":"wind", "地":"earth","岩":"earth","土":"earth","草":"earth", "电":"light","雷":"light","光":"light","暗":"light" };
      for (const [kw, el] of Object.entries(elemHints)) {
        if ((petMeta.displayName||"").includes(kw)) { setElement(el); break; }
      }
      const img = new Image();
      img.onload = function() {
        // Full spritesheet for upload
        var fc = document.createElement("canvas");
        fc.width = img.width; fc.height = img.height;
        fc.getContext("2d").drawImage(img, 0, 0);
        setResultUrl(fc.toDataURL("image/png"));
        // Cropped first frame for preview
        var tc = document.createElement("canvas");
        tc.width = 200; tc.height = 200;
        var ctx = tc.getContext("2d");
        ctx.drawImage(img, 0, 0, Math.min(img.width, 192), Math.min(img.height, 208), 0, 0, 200, 200);
        setThumbUrl(tc.toDataURL("image/png"));
        // animOrder/anims 优先用 validation.json 的真实数据（Petdex 9 行），其次 pet.json，最后 7 动画回退
        var animOrder = valAnimOrder || petMeta.animOrder || ["idle", "walk", "sleep", "celebrate", "think", "eat", "unhappy"];
        var anims = valAnims || petMeta.anims || { idle: 6, walk: 8, sleep: 6, celebrate: 4, think: 6, eat: 5, unhappy: 8 };
        var defaultDurations = { idle: 1100, walk: 1060, sleep: 1010, celebrate: 700, think: 1030, eat: 840, unhappy: 1220 };
        var durations = {};
        animOrder.forEach(function(a){ durations[a] = (petMeta.durations && petMeta.durations[a]) || defaultDurations[a] || 1000; });
        setPetJsonData({
          frameWidth: petMeta.frameWidth || 192,
          frameHeight: petMeta.frameHeight || 208,
          maxFrames: petMeta.maxFrames || 8,
          anims: anims,
          animOrder: animOrder,
          durations: durations
        });
        setImported(true);
        setTimeout(function() { render(); }, 0);
      };
      img.src = URL.createObjectURL(ssBlob);
      toast("✅ 素材包导入成功！请确认信息后保存");
    } catch(err) { toast("导入失败: " + err.message, "error"); }
    e.target.value = "";
  }

  async function doSavePet() {
    if (!resultUrl) { toast("请先导入素材包","error"); return; }
    if (!name.trim()) { toast("请输入名字","error"); return; }
    setSubmitting(true);
    try {
      // data URL → Blob，用 FormData 上传（避开 JSON base64 + Worker atob 重 CPU，且省 33% 体积）
      async function dataUrlToBlob(d) { return await (await fetch(d)).blob(); }
      const ssForm = new FormData();
      ssForm.append('file', await dataUrlToBlob(resultUrl), (name.trim()||"pet") + "-spritesheet.png");
      const ssResp = await api("/api/workshop/upload", { method:"POST", body: ssForm, timeout: 60000 });
      if (ssResp.error) { toast("上传失败: "+ssResp.error,"error"); setSubmitting(false); return; }
      const thumbForm = new FormData();
      thumbForm.append('file', await dataUrlToBlob(thumbUrl || resultUrl), (name.trim()||"pet") + "-thumb.png");
      const thumbResp = await api("/api/workshop/upload", { method:"POST", body: thumbForm, timeout: 60000 });
      if (thumbResp.error) { toast("缩略图上传失败: "+thumbResp.error,"error"); setSubmitting(false); return; }
      const tierData = TIERS.find(function(t){ return t.key===tier; });
      const d = await api("/api/workshop/pets", { method:"POST", body:JSON.stringify({ name: name.trim(), element: element, style: style, description: desc.trim(), tier: tierData.key, price: tierData.price, spritesheet_url: ssResp.key, thumbnail_url: thumbResp.key, pet_json: JSON.stringify(petJsonData), creator_name: creatorName || '' }) });
      if (d.error) { toast(d.error,"error"); setSubmitting(false); return; }
      toast("✅ 精灵已保存！");
      onCreated();
      render();
    } catch(err) { toast("保存失败: "+err.message,"error"); }
    setSubmitting(false);
  }

  return React.createElement("div", null,
    React.createElement("div", { className:"card" },
      React.createElement("h3", null, "📦 导入素材包"),
      React.createElement("p", { style:{ fontSize:12, color:"#94a3b8", marginBottom:16 } }, "从 Petdex 下载的素材包 (.zip)，包含 pet.json + spritesheet.webp"),
      !imported && React.createElement("div", { style:{ border:"2px dashed #e2e8f0", borderRadius:12, padding:40, textAlign:"center", cursor:"pointer" }, onClick:function(){ document.getElementById("importZipInput").click(); } },
        React.createElement("div", { style:{ fontSize:40, marginBottom:8 } }, "📦"),
        React.createElement("div", { style:{ fontSize:14, fontWeight:600, color:"#FF8C00" } }, "点击选择 .zip 文件"),
        React.createElement("div", { style:{ fontSize:11, color:"#94a3b8" } }, "支持 Petdex 导出格式"),
        React.createElement("input", { id:"importZipInput", type:"file", accept:".zip", style:{ display:"none" }, onChange:handleZipImport }),
      ),
      imported && React.createElement("div", null,
        React.createElement("div", { style:{ display:"flex", gap:16, flexWrap:"wrap" } },
          React.createElement("div", { style:{ flex:"1 1 200px" } },
            React.createElement("div", { className:"form-group" },
              React.createElement("label", null, "名字"),
              React.createElement("input", { className:"input", value:name, onChange:function(e){ setName(e.target.value); } }),
            ),
            React.createElement("div", { className:"form-group" },
              React.createElement("label", null, "元素"),
              React.createElement("div", { style:{ display:"flex", gap:6 } },
                ELEMENTS.map(function(el){ return React.createElement("button", { key:el, className:"element-btn" + (element===el?" sel":""), onClick:function(){ setElement(el); } }, ELEM_LABEL[el]); }),
              ),
            ),
            React.createElement("div", { className:"form-group" },
              React.createElement("label", null, "等级"),
              React.createElement("div", { style:{ display:"flex", gap:6 } },
                TIERS.map(function(t){ return React.createElement("button", { key:t.key, className:"element-btn" + (tier===t.key?" sel":""), onClick:function(){ setTier(t.key); } }, t.label + " " + t.price + "g"); }),
              ),
            ),
            React.createElement("div", { className:"form-group" },
              React.createElement("label", null, "描述"),
              React.createElement("textarea", { className:"input", value:desc, onChange:function(e){ setDesc(e.target.value); }, rows:2, style:{ resize:"vertical" } }),
            ),
          ),
          React.createElement("div", { style:{ width:220, flexShrink:0 } },
            React.createElement("div", { className:"preview-box", style:{ width:200, height:200 } },
              thumbUrl ? React.createElement("img", { src:thumbUrl }) :
              resultUrl ? React.createElement("img", { src:resultUrl }) :
              React.createElement("span", { style:{ fontSize:12, color:"#94a3b8", textAlign:"center" } }, "预览"),
            ),
          ),
        ),
        React.createElement("div", { style:{ display:"flex", gap:8, marginTop:12 } },
          React.createElement("button", { className:"btn btn-primary", onClick:doSavePet, disabled:submitting||!name.trim(), style:{ flex:1, padding:12 } },
            submitting ? "保存中..." : "💾 确认保存 (" + (TIERS.find(function(t){ return t.key===tier; })||{}).price + "g)"),
          React.createElement("button", { className:"btn btn-outline", onClick:function(){ setImported(false); setResultUrl(null); setThumbUrl(null); setName(""); setDesc(""); }, style:{ flex:1, padding:12 } },
            "🔄 重新导入"),
        ),
      ),
    ),
  );
}

  const [editCreator, setEditCreator] = React.useState('');

  const deletePet = async (id) => {
    if (!confirm('确定要删除这只精灵吗？')) return;
    const resp = await api('/api/workshop/pets/' + encodeURIComponent(id), { method: 'DELETE' });

  const startEdit = (p) => { setEditingId(p.id); setEditName(p.name); setEditCreator(p.teacher_name || ''); setEditElement(p.element || 'fire'); setEditTier(p.tier || 'common'); };
  const cancelEdit = () => { setEditingId(null); };
  const saveEdit = async (id) => {
    const resp = await api('/api/workshop/pets/' + encodeURIComponent(id), { method:'PUT', body:JSON.stringify({ name:editName.trim(), teacher_name:editCreator.trim(), element:editElement, tier:editTier }) });
    if (resp.error) { toast(resp.error,'error'); return; }
    toast('✅ 已更新'); setEditingId(null); onRefresh();
  };

  return React.createElement('div', null,
    pets.length === 0 ? React.createElement('div', { className:'card', style:{ textAlign:'center', padding:40, color:'#94a3b8' } }, '还没有精灵，去「📦 精灵工坊」导入吧') :
    pets.map(p => editingId === p.id ? React.createElement('div', { key:p.id, className:'card', style:{ border:'2px solid #FF8C00' } },
      React.createElement('div', { className:'form-group' },
        React.createElement('label', null, '名字'),
        React.createElement('input', { className:'input', value:editName, onChange:e=>setEditName(e.target.value) }),
      ),
      React.createElement('div', { className:'form-group' },
        React.createElement('label', null, '元素'),
        React.createElement('div', { style:{ display:'flex', gap:6 } },
          ELEMENTS.map(el => React.createElement('button', { key:el, className:'element-btn'+(editElement===el?' sel':''), onClick:()=>setEditElement(el), style:{ fontSize:13, padding:'6px 12px' } }, ELEM_LABEL[el]))
        ),
      ),
      React.createElement('div', { className:'form-group' },
        React.createElement('label', null, '等级'),
        React.createElement('select', { className:'input', value:editTier, onChange:e=>setEditTier(e.target.value) },
          Object.keys(TIER_LABEL).map(t => React.createElement('option', { key:t, value:t }, TIER_LABEL[t]))
        ),
        React.createElement('span', { style:{ fontSize:11, color:'#94a3b8' } }, '价格将自动更新: ', editTier==='legendary'?'500g':editTier==='rare'?'260g':'150g'),
      ),
      React.createElement('div', { className:'form-group' },
        React.createElement('label', null, '发布者'),
        React.createElement('input', { className:'input', value:editCreator, onChange:e=>setEditCreator(e.target.value), placeholder:'显示在学生端的名字' }),
      ),
      React.createElement('div', { style:{ display:'flex', gap:8 } },
        React.createElement('button', { className:'btn btn-primary', onClick:()=>saveEdit(p.id), style:{ flex:1 } }, '✅ 保存'),
        React.createElement('button', { className:'btn btn-outline', onClick:cancelEdit, style:{ flex:1 } }, '取消'),
      ),
    ) : React.createElement('div', { key:p.id, className:'pet-card' },
      React.createElement(PetThumb, { pet: p }),
      React.createElement('div', { style:{ flex:1 } },
        React.createElement('div', { style:{ fontWeight:700 } }, (ELEM_LABEL[p.element]||''), ' ', p.name),
        React.createElement('div', { style:{ fontSize:12, color:'#94a3b8' } }, '发布者: ', (p.teacher_name||'?'), ' · ', p.tier, ' · 🪙', p.price, 'g'),
      ),
      React.createElement('button', { className:'btn btn-outline', style:{ fontSize:12, marginRight:6 }, onClick:()=>startEdit(p) }, '✏️'),
      React.createElement('button', { className:'btn btn-danger', style:{ fontSize:12 }, onClick:()=>deletePet(p.id) }, '🗑'),
    )),
  );
}

function QianLongPanel() {
  // 潜龙计划验证码功能已删除（半成品：只能生成无法验证，学生端无入口，浪费 D1 写额度）
  return React.createElement('div', { className:'card' },
    React.createElement('h3', null, '🐉 潜龙计划'),
    React.createElement('div', { style:{ fontSize:12, color:'#94a3b8' } }, '该功能已下线。'),
  );
}

function App() {
  React.useEffect(() => {
    const token = localStorage.getItem('csp_admin_token');
    const tToken = localStorage.getItem('csp_teacher_token');
    const info = localStorage.getItem('csp_teacher_info');
    if (token) { state._adminToken = token; state.teacher = { teacher_id:'admin', name:'管理员' }; state.page='dashboard'; render(); }
    else if (tToken && info) { state.token = tToken; state.teacher = JSON.parse(info); state.page='dashboard'; render(); }
  }, []);
  if (state.page === 'login') return React.createElement(LoginPage);
  return React.createElement(Dashboard);
}

function render() { ReactDOM.render(React.createElement(App), document.getElementById('app')); }
render();
</script>
</body>
</html>
