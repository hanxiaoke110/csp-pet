<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + React + Typescript</title>
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Catch JS errors before React mounts (helps diagnose white screen)
      window.addEventListener('error', function(e) {
        var div = document.createElement('div');
        div.style.cssText = 'margin:20px;padding:16px;background:#fef2f2;border:2px solid #ef4444;border-radius:8px;font-family:monospace;font-size:13px;color:#dc2626;white-space:pre-wrap;word-break:break-all;';
        div.textContent = '❌ JS Error: ' + (e.message || e.error?.message || 'Unknown') + '\n' + (e.filename || '') + ':' + (e.lineno || '');
        document.body.appendChild(div);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var div = document.createElement('div');
        div.style.cssText = 'margin:20px;padding:16px;background:#fef2f2;border:2px solid #ef4444;border-radius:8px;font-family:monospace;font-size:13px;color:#dc2626;white-space:pre-wrap;word-break:break-all;';
        div.textContent = '❌ Promise Error: ' + (e.reason?.message || e.reason || 'Unknown');
        document.body.appendChild(div);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
