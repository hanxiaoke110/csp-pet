<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + React + Typescript</title>
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Block right-click context menu and DevTools shortcuts in production
      document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
      document.addEventListener('keydown', function(e) {
        // Block F12, Ctrl+Shift+I/J/C, Ctrl+U, Cmd+Option+I/J/C/U (macOS DevTools)
        if (e.key === 'F12' ||
            (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.code === 'KeyI' || e.code === 'KeyJ' || e.code === 'KeyC')) ||
            (e.ctrlKey && (e.key === 'U' || e.code === 'KeyU')) ||
            (e.metaKey && e.altKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.key === 'U' || e.code === 'KeyI' || e.code === 'KeyJ' || e.code === 'KeyC' || e.code === 'KeyU'))) {
          e.preventDefault(); return false;
        }
      });
      // Catch JS errors before React mounts (helps diagnose white screen)
      window.addEventListener('error', function(e) {
        var div = document.createElement('div');
        div.style.cssText = 'margin:20px;padding:16px;background:#fef2f2;border:2px solid #ef4444;border-radius:8px;font-family:monospace;font-size:13px;color:#dc2626;white-space:pre-wrap;word-break:break-all;';
        div.textContent = '❌ JS Error: ' + (e.message || e.error?.message || 'Unknown') + '\n' + (e.filename || '') + ':' + (e.lineno || '');
        document.body.appendChild(div);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason;
        var msg = (reason && (reason.message || String(reason))) || 'Unknown';
        // 良性：Tauri 事件 unlisten 在 webview 重载/路由切换/StrictMode 双调用时，
        // 内部 unregisterListener 访问已不存在的 listeners[eventId] 抛错。
        // 我们的 safeListen 已吞掉绝大多数；这里再兜一层，避免剩余的惊吓用户。
        if (msg.indexOf("listeners[eventId]") !== -1 || msg.indexOf("handlerId") !== -1) {
          e.preventDefault();
          return;
        }
        var div = document.createElement('div');
        div.style.cssText = 'margin:20px;padding:16px;background:#fef2f2;border:2px solid #ef4444;border-radius:8px;font-family:monospace;font-size:13px;color:#dc2626;white-space:pre-wrap;word-break:break-all;';
        div.textContent = '❌ Promise Error: ' + msg;
        document.body.appendChild(div);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
