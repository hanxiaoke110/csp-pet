第一位叫阿贪，他走进山里，见到最大的药材就采——这株灵芝不错，摘了！那边有棵大人参，挖了！篓子很快装满，阿贪开心地下了山。

可到了药铺，掌柜摇摇头：「这些都是普通货色，值不了几个钱。」

第二位叫阿远，他不急着采。他先花了一整天在山里转悠，把所有珍贵药材的位置标在地图上。然后他坐下来，规划了一条路线——怎样用最短的路，采到价值总和最高的一批药。

两天后阿远才下山。他的篓子不比阿贪的大，但药铺掌柜接过一看，眼睛亮了：「这是百年灵芝！这是雪山红景天！你这一篓，顶得上阿贪十篓。」

阿贪恍然大悟：自己每次都选了「眼前最好的」，但加起来，却不是「整体最好的」。`,reveal:`这个故事讲的是「贪心算法」和「动态规划」的区别。

阿贪用的就是贪心策略——每一步选当前最优的药材。虽然简单快速，但不能保证全局最优。阿远用的则是动态规划思维——先全面了解情况，再规划整体最优路径。

CSP-J考试中，很多题看着像贪心，其实需要动规。判断标准就是：当前最优选择会不会影响后续的最优选择？如果会，就不能贪心。`,oneLiner:"贪心是「只顾眼前」，动规是「放眼全局」。"},{id:"recursion-mirror",knowledgePoints:["递归","递归算法","递归函数","递归核心特征","递归算法时间复杂度","函数递归","递归与递推"],title:"镜中镜的旅人",npc:"灵码洞·守关者",story:`有一位旅人走进一座全是大镜子的宫殿。

他站在两面相对的镜子之间，看到了无限多个自己——大的、小的、更小的，一直延伸到看不见的远方……最小的那个身影已经模糊得快要消失了。

旅人想：「如果最小的那个我先停下来，不继续照镜子了，会发生什么？」

于是最小的那个他真的停了下来。然后他前面那个稍微大一点的自己，也接住了这个决定，往回走了。一层一层……从最小的那个，回到稍大的，再回到更大的，最终——最大的那个旅人睁开了眼睛。

他终于明白了：要结束这个无限的镜中世界，靠的不是最外面的人喊停——而是最深处那个「不再有下一层」的自己。`,reveal:`这个故事讲的是「递归」的核心——基线条件（base case）。

镜中的无限嵌套就是递归调用，每一层都在等待下一层的结果。但递归不能真的无限下去——必须有一个「最小的那个自己」站出来说「我不继续了」，这就是基线条件。有了基线条件，递归才能从最深处一层层返回结果。

写递归函数最容易犯的错误就是忘了写基线条件——就像那些镜子永远反射下去，最后栈溢出（Stack Overflow）了。`,oneLiner:"递归的本质是「大问题分解成小问题，小到不能再小就是答案」。"},{id:"stack-plates",knowledgePoints:["栈","栈-出栈序列","栈出栈序列","栈容量计算","单调栈","后缀表达式","前缀表达式"],title:"食堂收盘子的人",npc:"万木林·守关者",story:`学校食堂有个奇怪的规矩：餐盘必须一个一个叠起来放。

学生们吃完饭，把盘子往上一摞。李师傅负责收盘子——她发现，最后放上去的那个盘子，一定是第一个被拿走的。先放的呢？被压在最下面，等到上面的都拿完了，才轮到它。

有一天，一个学生想插队——直接抽最下面的盘子。哗啦！整摞盘子倒了。

李师傅摇摇头：「孩子，这个叫后进先出——后来的一定先走，这是规矩。你要么接受它，要么打翻它。」`,reveal:`这个故事讲的是「栈」（Stack）这种数据结构。

栈就像那摞餐盘——只能从顶部放入（push）和取出（pop）。后来的一定先走，这个特性叫「后进先出」（LIFO）。

在CSP考试中，栈经常出现在「出栈序列判断」题——给你一个入栈顺序，问某个出栈顺序是否合法。关键就是：栈顶元素必须先出，不能跳过它去取下面的。

另外，「先来的要等后来的先处理」这种模式，在括号匹配、表达式求值、函数调用中都用到栈。`,oneLiner:"栈就是「后来居上」——最后进去的最先出来。"},{id:"binary-search-hot-water",knowledgePoints:["二分查找","二分","二分答案","二分查找边界分析","二分搜索","二分查找（精度控制）","实数二分查找","实数域二分查找"],title:"调水温的聪明人",npc:"算法塔·守关者",story:`两个人要调一杯刚好40度的温水。

第一人从0度开始，一度一度往上加。他加了40次，终于到了40度——但手已经酸了。

第二人想了个办法：先试50度。太烫了。那说明40度在0到50之间。他再试25度。太凉了。那就在25到50之间……每次他都猜剩余范围的中间值。

猜了不到7次，他就准确地找到了40度。

第一人不服：「你怎么这么快？」

第二人笑道：「因为我每次都能排除一半的可能性。100里排除一半是50，再一半是25……范围缩小的速度是指数级的。」`,reveal:`这个故事讲的是「二分查找」和「二分答案」。

二分查找的核心思想是：每次把搜索范围减半。100个元素，第一次排除50个，第二次排除25个……只需要大约7步就能找到目标。而暴力方法平均要50步。

在CSP-J考试中，二分不仅用于查找，还用于「二分答案」——当答案本身具有单调性时，我们可以「猜」一个答案，然后验证它是大了还是小了，逐步逼近正确答案。

关键前提：数据必须是有序的（或者答案具有单调性），否则二分无效。`,oneLiner:"二分不是找答案，而是「每次排除一半的不可能」——范围缩小速度是指数级的。"},{id:"huffman-postman",knowledgePoints:["哈夫曼编码","Huffman编码","信息熵","信息熵计算","Base64编码","Base64解码","Base64解码实现"],title:"邮差的打包术",npc:"数术殿·守关者",story:`小镇上有个老邮差，每天要给不同的村子送信。

但他发现一个秘密：有些村子几乎每天都收到信（像镇长的办公室），有些村子一个月才一封（像山顶那个独居的老人）。

老邮差想了个聪明的办法——给「常收信的村子」编短号：镇长办公室就是「1」，学校是「01」，商店是「001」。而那些不常收信的村子呢？用长一点的编号也无所谓，反正不常用。

这样一来，他每天写的总编号长度大大缩短了。旁人问他怎么想出来的，老邮差抽了口烟：「这叫——常用的东西，给它最短的名字。」`,reveal:`这个故事讲的是「哈夫曼编码」——一种最优前缀编码。

哈夫曼编码的核心思想就是老邮差的做法：出现频率越高的字符，用越短的二进制编码表示；出现频率越低的，用长的编码。这样可以使得整体编码长度最短。

在CSP-J考试中，哈夫曼编码会考察：构建哈夫曼树（每次取两个最小的合并）、计算带权路径长度（WPL）、以及编码是否具有前缀性（任何一个编码不能是另一个编码的前缀）。

哈夫曼本质上是一种贪心算法——每次选最小的两个合并。`,oneLiner:"哈夫曼编码就是「给最常见的字符最短的编号」——这是一种贪心策略。"},{id:"dp-letters",knowledgePoints:["动态规划","动态规划特征","DP","动态规划—数字三角形","编辑距离DP","LCS最长公共子序列DP","最长公共子序列LCS（DP实现）","01背包与完全背包DP区别","树形DP—最大独立集"],title:"旅人留下的笔记",npc:"算法塔·守关者",story:`一个旅人穿越一片巨大的森林，森林里有无数岔路。每条岔路口都有一块石头。

这位旅人和别人不一样——他随身带着一支粉笔。每走到一个岔路口，他就在石头上写一句话：

「如果你也走到了这里——记住，从入口到这里，最短的路是3天。」

然后他继续前进。下一个路口：「如果你也走到这里——最短是5天。」

后来的人沿着他走过的路前行，看到石头上的笔记，就不用重新探索了——他们直接站在前人的肩膀上继续向前。

最后抵达终点的旅人算了算时间：「谢谢那位留下笔记的人，我省了至少两个月的迷路时间。」`,reveal:`这个故事讲的是「动态规划」的核心——记忆化（Memoization）和状态转移。

旅人在每个路口留下的笔记就是「DP状态」——「到这个位置的最短时间」。后来的人看到笔记就不用重新计算，这就是「记忆化」——避免重复计算已经求解过的子问题。

而「从前一个路口到下一个路口的时间」就是「状态转移方程」。动态规划的本质是：大问题可以分解成重叠的小问题，把每个小问题的答案记下来，最后组合出大问题的答案。

在CSP-J考试中，动规题的关键是找到「状态定义」和「转移方程」——就像旅人定义「到这个路口的最短时间」一样。`,oneLiner:"动态规划就是「把走过的路记下来，让后来的人不用重走一遍」。"},{id:"binary-tree-family",knowledgePoints:["二叉树","完全二叉树","二叉树遍历","二叉树三序遍历关系","完全二叉树形态","完全二叉树节点下标","树的遍历","树","树结构","树的重心"],title:"家谱画师",npc:"万木林·守关者",story:`一位画师受雇为一大家族画家谱树。

他定了三条规则：每个家长最多有两个孩子，左边的孩子大，右边的孩子小。

画完之后，族长问他三种看家谱的方式：

「先看我，再看左孩子全家，再看右孩子全家。」画师一眼扫过——这叫「前序遍历」。

「先看左孩子全家，再看我，再看右孩子全家。」画师从左下角开始往上看——这叫「中序遍历」。

「先看完左孩子全家，再看完右孩子全家，最后再看我。」画师从叶子往根看——这叫「后序遍历」。

三种看法，三种顺序——但看的都是同一棵家谱树。族长满意了：「好画师！一图三看！」`,reveal:`这个故事讲的是「二叉树」和「树的三种遍历方式」。

二叉树是一种每个节点最多有两个子节点的树结构。三种遍历方式是CSP-J必考内容：
- 前序遍历：根→左→右（先看自己）
- 中序遍历：左→根→右（先看左孩子）
- 后序遍历：左→右→根（最后看自己）

更重要的考点：给定前序+中序（或后序+中序）能唯一确定一棵二叉树。因为中序遍历告诉我们谁是左子树谁是右子树，前序/后序告诉我们根在哪。`,oneLiner:"二叉树就是「一图三看」——前序、中序、后序，三种顺序三种用途。"},{id:"permutation-king",knowledgePoints:["排列组合","排列组合-捆绑法","排列组合-插板法","排列组合-配对问题","排列组合-数字排列","排列组合—有重复元素的排列","排列组合分组","组合数学","组合","排列"],title:"国王选妃的烦恼",npc:"天算台·守关者",story:`从前有个国王，要从100个候选妃子中选出5个，排成一排站在他面前。

国王掰着手指数：「第1个位置有100种选择，第2个还有99种，第3个98种……但是等等——选A再选B，和选B再选A，如果只是排队的话，是不同的排法对吗？」

他的数学顾问——一个白发老人，在沙地上画了几条线：「陛下，如果顺序重要，这叫排列，答案是 100×99×98×97×96。但如果只是选5个人，不管顺序，那你还得除以5×4×3×2×1——因为同一组人有5!种排法，但本质上还是同5个人。」

国王恍然大悟：「所以排列和组合的区别就是——在不在意排队的顺序！」`,reveal:`这个故事讲的是「排列与组合」的根本区别。

排列（Permutation）：顺序重要。从n个中选m个排成一排，公式是 P(n,m) = n!/(n-m)!。
组合（Combination）：顺序不重要。从n个中选m个，公式是 C(n,m) = n!/(m!(n-m)!))。

CSP-J常考技巧：
- 捆绑法：几个人必须站在一起 = 先绑成一个人
- 插板法：相同物品分给不同人
- 有重复元素的排列：总数阶乘除以每种重复的阶乘

判断标准就一句话：交换两个人算不算新情况？算就是排列，不算就是组合。`,oneLiner:"排列和组合的唯一区别——交换两个位置，算不算新结果？"},{id:"number-system-cake",knowledgePoints:["进制转换","二进制","二进制运算","进制转换-小数","进制转换-进位统计","进制转换八进制转十进制","十六进制计算","十六进制运算","二进制逻辑或运算","原码反码补码"],title:"蛋糕师傅的进制秤",npc:"数术殿·守关者",story:`一位蛋糕师傅用的秤坏了，只能显示「满」或「空」。他灵机一动——用四个同样大小的砝码来称面粉。

第一个砝码是1斤，第二个是2斤，第三个是4斤，第四个是8斤。

当他想称5斤面粉时：4斤砝码(满)+1斤砝码(满)=5斤。他在账本上写下「0101」——四个砝码对应四个数字，满=1，空=0。

徒弟看傻了：「师傅，为什么用这些奇怪的数字？」

师傅说：「因为秤只会说『满』和『空』——它就是一台只有两个状态的机器。但用这两个状态，我可以表示任何数字！」`,reveal:`这个故事讲的是「二进制」以及为什么计算机用它。

二进制的核心：用0和1两个符号表示所有数字。就像蛋糕师傅的砝码（1,2,4,8...每个是2的幂），二进制中的每一位都代表一个2的幂。

计算机用二进制是因为电路只有两种状态——通电(1)和断电(0)。

CSP-J常考：
- 二进制/八进制/十六进制互转
- 原码、反码、补码（尤其是负数的补码表示）
- 位运算（& | ^ ~ << >>）
- 进制转换的本质：按权展开求和`,oneLiner:"二进制就是用0和1表示万物——因为计算机只认识两个状态。"},{id:"sorting-race",knowledgePoints:["排序算法","排序算法稳定性","冒泡排序","冒泡排序优化","选择排序","插入排序","快速排序","快速排序时间复杂度","归并排序","归并排序—最坏情况比较次数","std::sort复杂度"],title:"排队比赛",npc:"算法塔·守关者",story:`体育课，老师让40个学生按身高排成一列。

小明自告奋勇当队长，用了最笨的办法：一个一个看，把最矮的揪出来放第一个，再从剩下的找最矮的放第二个……同学们等得都快睡着了。

小红用了另一招：相邻两个人比一下，矮的往前走一步——像泡泡慢慢浮上水面。虽然还是一次次比，但至少不用全场找人了。

最后老师出手了：他选了一个「基准」同学，比他矮的站左边，比他高的站右边。然后左右两边各自再选基准、再分……眨眼间队伍就排好了。

老师对小明说：「这就是为什么选基准的人（pivot）这么重要——选好了，事半功倍；选坏了，就像你刚才那样。」`,reveal:`这个故事讲了三种排序算法：

小明的做法 = 选择排序：每轮找最小值放前面，O(n²)，不管数据是否已经有序。
小红的做法 = 冒泡排序：相邻比较交换，O(n²)，但可以提前终止。
老师的做法 = 快速排序：选基准分两边，平均O(n log n)，但最坏情况（选到最小/最大）退化为O(n²)。

CSP-J常考排序算法的：时间复杂度、稳定性（相等元素相对顺序是否不变）、适用场景。

一句话：冒泡和选择是O(n²)，快排和归并是O(n log n)，但归并需要额外空间。`,oneLiner:"排序算法的灵魂在于「比较次数」——O(n²)是慢慢比，O(n log n)是聪明地比。"},{id:"pointer-map",knowledgePoints:["指针","指针与数组","指针赋值","引用","C++引用","shared_ptr引用计数","std::move语义"],title:"藏宝图的秘密",npc:"灵码洞·守关者",story:`一位海盗船长画了两样东西给他的大副：一张藏宝图（画着宝藏的位置），和一个钥匙（能打开宝箱）。

大副糊涂了：「船长，为什么不直接把宝藏给我？」

船长笑道：「因为宝藏太重了你搬不动！我给你的不是宝藏本身——是它的位置。你随时可以按图索骥找到它。」

大副又问：「那这个钥匙呢？」

「钥匙也是一样——它不改变锁，但它给了你『打开锁的能力』。你可以用钥匙开门，也可以把钥匙交给别人去开门。」

大副恍然大悟：原来船长给他的不是东西本身，而是「找到东西的方法」和「改变东西的能力」。`,reveal:`这个故事讲了C++中两个容易混淆的概念：「指针」和「引用」。

藏宝图 = 指针（Pointer）：它存的是地址，不是真的东西。你可以通过地址找到真正的宝藏（解引用），也可以让藏宝图指向别的地方。

钥匙 = 引用（Reference）：它是某个东西的「别名」，你通过它来操作那个东西。引用必须在一开始就绑定到某个对象，不能改变。

CSP-J常考：
- 指针存地址，引用是别名
- 指针可以空（nullptr），引用不能空
- 函数传参时，传值和传引用的区别（传引用避免拷贝）`,oneLiner:"指针是「藏宝图」（存地址），引用是「钥匙」（别名）——但都不能当原物用。"},{id:"graph-bridge",knowledgePoints:["图论","图","图的存储","图的存储结构","有向图弱连通","图论-连通性","图论-树","图二染色问题","强连通分量","最小生成树","拓扑排序","拓扑排序应用场景"],title:"七座桥与一位散步者",npc:"万木林·守关者",story:`欧洲有个小城叫哥尼斯堡，城中有七座桥连接四片陆地。

城里人喜欢散步，大家经常问一个问题：「能不能一次走遍七座桥，每座桥只走一次，还能回到出发点？」

所有人都在地上画图试——没有人成功过。

直到一位数学家路过，他没有画路线，而是把四片陆地画成四个点，把七座桥画成连接这些点的七条线。然后他说了一句改变历史的话：

「四个点全都有奇数条线连着——在数学上，这是不可能的。问题不在于怎么走，而在于结构本身就不可能。」`,reveal:`这个故事讲的是「图论」的起源——欧拉解决哥尼斯堡七桥问题。

图（Graph）由节点（顶点）和边组成。欧拉证明了：如果要一笔画走完所有边且不重复，最多只能有两个奇度节点（有奇数条边的节点）。七桥问题有四个奇度节点——所以无解。

在CSP-J/S考试中，图论是核心考点：
- 图的存储：邻接矩阵 vs 邻接表（稀疏图用邻接表）
- 图的遍历：DFS（深度优先）和BFS（广度优先）
- 连通性：无向图连通分量、有向图强连通分量
- 特殊图：树（无环连通图）、二分图（可以二染色）

记住：图就是把「关系」变成可以计算的结构。`,oneLiner:"图就是把世界抽象成「点」和「边」——点代表事物，边代表它们之间的关系。"},{id:"time-complexity-library",knowledgePoints:["时间复杂度","时间复杂度分析","空间复杂度","算法分析-最值","稀疏图时间复杂度"],title:"图书馆找书人",npc:"灵码洞·守关者",story:`两人在图书馆找一本特定的书。

甲直接走到书架前，从左到右一本一本翻。100本书？翻100次。1000本？翻1000次。

乙先走到目录柜，按书名字母顺序找到了索书号，然后径直走到对应的书架，前后只花了半分钟。

甲不服：「万一书不在目录里呢？」

乙说：「那也一样——目录告诉我它不存在，不用翻遍整个图书馆才知道。」

图书馆长在一旁笑了：「100本书和10000本书，对甲来说差100倍时间。但对乙来说——只是多翻几页目录而已。」`,reveal:`这个故事讲的是「时间复杂度」和「大O表示法」。

甲的方法 = O(n)：时间随数据量线性增长。100本书100次，10000本10000次。
乙的方法 = O(log n)：时间随数据量对数增长。100本和10000本只差几倍。

CSP-J/S考试中，分析时间复杂度是基本功：
- O(1)：常数时间，不管多少数据都一样快
- O(n)：线性时间，数据翻倍，时间翻倍
- O(n²)：平方时间，数据翻倍，时间翻四倍
- O(log n)：对数时间，数据翻倍，时间只加一丁点
